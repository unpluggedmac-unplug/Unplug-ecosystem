<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/runtime-config"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unplug Magazine</title>
  <link rel="canonical" href="unplug-magazine.html">
  <script>
    (function () {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var params = new URLSearchParams(search);

      // Agreement Forms has its own public signer. Preserve the legacy
      // ?p=agreement&slug=... links that may already exist in email/history,
      // but land them on the dedicated signer instead of the magazine shell.
      if (params.get('p') === 'agreement' && params.get('slug')) {
        window.location.replace('unplug-agreement.html?slug=' + encodeURIComponent(params.get('slug')));
        return;
      }

      // Preserve the original external referrer across the bare-domain hop so
      // campaign attribution is not turned into a self-referral.
      try {
        var ref = document.referrer || '';
        if (ref && ref.indexOf(window.location.host) === -1) {
          sessionStorage.setItem('unplug_entry_referrer', ref);
        }
      } catch (e) { /* private mode — the redirect still works */ }

      window.location.replace('unplug-magazine.html' + search + hash);
    })();
  </script>
<link rel="stylesheet" href="unplug-tokens.css">
</head>
<body>
  <p>Redirecting to <a href="unplug-magazine.html">Unplug Magazine</a>…</p>
  <noscript><meta http-equiv="refresh" content="0; url=unplug-magazine.html"></noscript>
</body>
</html>
