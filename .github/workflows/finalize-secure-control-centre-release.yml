name: Finalize secure Control Centre release

on:
  push:
    branches:
      - production-control-centre-release-20260910

permissions:
  contents: write

jobs:
  finalize-security:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Reproduce validated secure dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd unplug-backend
          npm audit fix --omit=dev --package-lock-only
          actual=$(sha256sum package-lock.json | awk '{print $1}')
          expected='8caf9d6c3e100c05c478fbb624d0c567eda7831f8181c946167beffd8923b79f'
          echo "candidate lockfile sha256: $actual"
          test "$actual" = "$expected"

      - name: Verify production dependency audit is clean
        shell: bash
        run: |
          set -euo pipefail
          cd unplug-backend
          npm ci --omit=dev
          npm audit --omit=dev --audit-level=moderate

      - name: Run complete backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd unplug-backend
          npm ci
          npm test

      - name: Guard release diff
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          echo "$changed"
          test "$changed" = 'unplug-backend/package-lock.json'

      - name: Commit validated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-secure-control-centre-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unplug-backend/package-lock.json .github/workflows/finalize-secure-control-centre-release.yml
          staged=$(git diff --cached --name-only | sort)
          expected=$(printf '%s\n%s\n' '.github/workflows/finalize-secure-control-centre-release.yml' 'unplug-backend/package-lock.json' | sort)
          test "$staged" = "$expected"
          git commit -m 'Finalize validated dependency security remediation'
          git push origin HEAD:production-control-centre-release-20260910
