name: Backend regression CI

on:
  push:
    paths:
      - 'unplug-backend/**'
      - '.github/workflows/backend-regression-ci.yml'
  pull_request:
    paths:
      - 'unplug-backend/**'
      - '.github/workflows/backend-regression-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-backend-regression:
    name: Full backend regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Clear stale embedded PostgreSQL processes
        run: node scripts/sweep-test-postgres.js

      - name: Prepare text-search fixture
        run: node scripts/ensure-text-search.js

      - name: Run complete backend suite
        shell: bash
        run: |
          set -o pipefail
          find test -name '*.test.js' -print0 | sort -z | xargs -0 node --test --test-concurrency=1
