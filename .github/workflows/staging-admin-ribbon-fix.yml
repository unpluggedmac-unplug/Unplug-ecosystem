name: One-time staging admin ribbon fix

on:
  push:
    branches:
      - staging-control-centre
    paths:
      - .github/workflows/staging-admin-ribbon-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-control-centre
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply admin staging marker patch
        run: python3 scripts/staging-admin-ribbon-fix.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend safety and build
        run: npm run staging:check && npm run security:check && npm run build

      - name: Run staging auth and ribbon regression guards
        working-directory: unplug-backend
        run: node --test test/adminStagingRibbon.test.js test/passwordResetAndLogoutUiGuard.test.js

      - name: Commit tested patch
        run: |
          rm -f .github/workflows/staging-admin-ribbon-fix.yml scripts/staging-admin-ribbon-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unplug-admin-dashboard.html unplug-backend/test/adminStagingRibbon.test.js .github/workflows/staging-admin-ribbon-fix.yml scripts/staging-admin-ribbon-fix.py
          git commit -m 'Show staging marker in Admin Control Centre'
          git push origin HEAD:staging-control-centre
