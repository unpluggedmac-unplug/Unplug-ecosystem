name: Staging manage editor visibility fix

on:
  push:
    branches:
      - staging-control-centre
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Make All Content editor visible on open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-control-centre
      - name: Make editor visible and scroll into view
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('unplug-admin-dashboard.html')
          s = p.read_text()
          old = """  document.getElementById('manageEditTitle').textContent = `Edit #${item.id}`;\n  panel.style.display = 'block';\n\n  body.innerHTML = '';"""
          new = """  document.getElementById('manageEditTitle').textContent = `Edit #${item.id}`;\n  panel.style.display = 'block';\n  panel.style.border = '2px solid var(--red)';\n  // The editor lives after the potentially very wide/long content table.\n  // Bring it into view immediately so clicking Edit never appears to do nothing.\n  setTimeout(() => {\n    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });\n    panel.setAttribute('tabindex', '-1');\n    panel.focus({ preventScroll: true });\n  }, 0);\n\n  body.innerHTML = '';"""
          if old not in s:
              raise SystemExit('Target editor block not found; refusing to patch.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Check patch
        run: |
          git diff --check
          node scripts/staging-frontend-check.js
      - name: Commit staging fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unplug-admin-dashboard.html
          git commit -m "Make All Content editor visible on open"
          git push origin staging-control-centre
