name: One-time staging CMS base-state fix

on:
  push:
    branches:
      - staging-control-centre
    paths:
      - .github/workflows/staging-page-cms-basestate-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/staging-control-centre'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-control-centre
          fetch-depth: 0
      - name: Fix CMS base-state comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('unplug-backend/src/routes/pageContent.js')
          s = p.read_text()
          old = """function sameBaseState(a, b) {
            return JSON.stringify(a || {}) === JSON.stringify(b || {});
          }
          """
          new = """function sameBaseState(a, b) {
            // base_state is stored as PostgreSQL JSONB. JSONB does not preserve
            // object key order, so comparing JSON.stringify(...) can report a
            // false conflict even when every value is identical. Compare the
            // four concurrency-guard fields semantically instead, normalising
            // timestamps and numeric counts across JSON/pg representations.
            const left = a || {};
            const right = b || {};
            const stamp = (value) => value ? new Date(value).toISOString() : null;
            return stamp(left.contentUpdatedAt) === stamp(right.contentUpdatedAt)
              && stamp(left.blocksUpdatedAt) === stamp(right.blocksUpdatedAt)
              && Number(left.contentCount || 0) === Number(right.contentCount || 0)
              && Number(left.blockCount || 0) === Number(right.blockCount || 0);
          }
          """
          if old not in s:
              raise SystemExit('Target sameBaseState function not found; refusing to patch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate patch
        run: |
          git diff --check
          node --check unplug-backend/src/routes/pageContent.js
          cd unplug-backend
          npm ci --omit=dev
          npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unplug-backend/src/routes/pageContent.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix false CMS draft publish conflicts"
          git push origin HEAD:staging-control-centre
