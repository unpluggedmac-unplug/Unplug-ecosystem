      - 'docs/progress-log.md'
      - 'docs/pricing-comparison.md'
      - '.github/workflows/member-dashboard-control-centre-ci.yml'
  pull_request:
    paths:
      - 'unplug-member-dashboard.html'
      - 'unplug-checkout.html'
      - 'unplug-admin-dashboard.html'
      - 'chatbot.js'
      - 'unplug-backend/src/routes/payments.js'
      - 'unplug-backend/src/routes/highlights.js'
      - 'unplug-backend/src/routes/adBanners.js'
      - 'unplug-backend/src/utils/servicePackages.js'
      - 'unplug-backend/src/utils/directoryPackages.js'
      - 'unplug-backend/db/migrations/214_directory_package_pricing.sql'
      - 'unplug-backend/test/batchDPricing.test.js'
      - 'unplug-backend/test/batchDPricingUi.test.js'
      - 'unplug-backend/test/pricingSingleSource.test.js'
      - 'unplug-backend/test/servicePackages.test.js'
      - 'unplug-backend/test/commercialCheckoutGuards.static.test.js'
      - 'unplug-backend/test/directoryPackageComparison.test.js'
      - 'unplug-backend/test/investorProposition.test.js'
      - 'unplug-backend/src/routes/orders.js'
      - 'unplug-backend/src/utils/orderServiceStatus.js'
      - 'unplug-backend/test/myOrders.test.js'
      - 'unplug-backend/test/myOrdersStatusUi.test.js'
      - 'unplug-magazine.html'
      - 'unplug-backend/src/routes/myUnplug.js'
      - 'unplug-backend/src/routes/search.js'
      - 'unplug-backend/db/migrations/213_my_unplug_privacy_custom_interests.sql'
      - 'unplug-backend/test/myUnplugProfile.test.js'
      - 'unplug-backend/test/myUnplugPrivacyUi.test.js'
      - 'unplug-backend/test/tags.test.js'
      - 'unplug-backend/test/siteSearch.test.js'
      - 'unplug-backend/test/featuredMembers.test.js'
      - 'functions/runtime-config.js'
      - 'media/scripts/member-dashboard-control-centre*.js'
      - 'media/scripts/member-dashboard-service-shortcuts.js'
      - 'media/styles/member-dashboard-control-centre*.css'
      - 'media/styles/member-dashboard-service-shortcuts.css'
      - 'unplug-backend/test/memberDashboardControlCentre*.test.js'
      - 'unplug-backend/test/memberDashboardServiceShortcuts.test.js'
      - 'unplug-backend/src/routes/profileAnalytics.js'
      - 'unplug-backend/test/profileAnalytics.test.js'
      - 'unplug-backend/test/myAnalyticsRealData.test.js'
      - 'docs/proposals/member-dashboard-control-centre-HANDOVER.md'
      - 'docs/progress-log.md'
      - 'docs/pricing-comparison.md'
      - '.github/workflows/member-dashboard-control-centre-ci.yml'

permissions:
  contents: read

concurrency:
  group: member-dashboard-control-centre-${{ github.ref }}
  cancel-in-progress: true

jobs:
  member-analytics-backend:
    name: Member Analytics backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Clear stale embedded PostgreSQL processes
        run: node scripts/sweep-test-postgres.js

      - name: Prepare text-search fixture
        run: node scripts/ensure-text-search.js

      - name: Run Member Analytics tests
        run: >-
          node --test --test-concurrency=1
          test/profileAnalytics.test.js
          test/myAnalyticsRealData.test.js

  my-unplug-privacy:
    name: My Unplug privacy & custom interests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax-check privacy routes and tests
        run: |
          node --check src/routes/myUnplug.js
          node --check src/routes/search.js
          node --check test/myUnplugProfile.test.js
          node --check test/myUnplugPrivacyUi.test.js
          node --check test/tags.test.js
          node --check test/siteSearch.test.js
          node --check test/featuredMembers.test.js

      - name: Clear stale embedded PostgreSQL processes
        run: node scripts/sweep-test-postgres.js

      - name: Prepare text-search fixture
        run: node scripts/ensure-text-search.js

      - name: Run My Unplug privacy regression tests
        run: >-
          node --test --test-concurrency=1
          test/myUnplugProfile.test.js
          test/myUnplugPrivacyUi.test.js
          test/tags.test.js
          test/siteSearch.test.js
          test/featuredMembers.test.js

  my-orders-status:
    name: My Orders payment & service status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax-check My Orders status files
        run: |
          node --check src/routes/orders.js
          node --check src/utils/orderServiceStatus.js
          node --check test/myOrders.test.js
          node --check test/myOrdersStatusUi.test.js

      - name: Clear stale embedded PostgreSQL processes
        run: node scripts/sweep-test-postgres.js

      - name: Prepare text-search fixture
        run: node scripts/ensure-text-search.js

      - name: Run My Orders status tests
        run: >-
          node --test --test-concurrency=1
          test/myOrders.test.js
          test/myOrdersStatusUi.test.js

  batch-d-pricing:
    name: Batch D pricing safety
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax-check Batch D backend and JS files
        run: |
          node --check src/routes/payments.js
          node --check src/routes/orders.js
          node --check src/routes/highlights.js
          node --check src/routes/adBanners.js
          node --check src/utils/servicePackages.js
          node --check src/utils/directoryPackages.js
          node --check test/batchDPricing.test.js
          node --check test/batchDPricingUi.test.js
          node --check test/pricingSingleSource.test.js
          node --check test/servicePackages.test.js
          node --check ../chatbot.js

      - name: Clear stale embedded PostgreSQL processes
        run: node scripts/sweep-test-postgres.js

      - name: Prepare text-search fixture
        run: node scripts/ensure-text-search.js

      - name: Run Batch D pricing tests
        run: >-
          node --test --test-concurrency=1
          test/batchDPricing.test.js
          test/batchDPricingUi.test.js
          test/pricingSingleSource.test.js
          test/servicePackages.test.js
          test/directoryPackageComparison.test.js
          test/investorProposition.test.js
          test/highlights.test.js
          test/adBanners.test.js

  full-backend-regression:
    name: Full backend regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Clear stale embedded PostgreSQL processes
        run: node scripts/sweep-test-postgres.js

      - name: Prepare text-search fixture
        run: node scripts/ensure-text-search.js

      - name: Run complete backend suite
        shell: bash
        run: |
          set -o pipefail
          find test -name '*.test.js' -print0 | sort -z | xargs -0 node --test --test-concurrency=1

  member-dashboard-control-centre:
    name: Member Dashboard regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check Member Dashboard scripts
        run: |
          node --check media/scripts/member-dashboard-control-centre-loader.js
          node --check media/scripts/member-dashboard-control-centre.js
          node --check media/scripts/member-dashboard-control-centre-polish.js
          node --check media/scripts/member-dashboard-service-shortcuts.js

      - name: Run Member Dashboard Control Centre tests
        run: >-
          node --test
          unplug-backend/test/memberDashboardControlCentre.test.js
          unplug-backend/test/memberDashboardControlCentrePolish.test.js
          unplug-backend/test/memberDashboardServiceShortcuts.test.js

  frontend-package:
    name: Member Dashboard packaged asset check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build exact frontend candidate
        run: npm run build

      - name: Verify Member Dashboard assets are packaged
        run: |
          test -f dist/unplug-member-dashboard.html
          test -f dist/media/scripts/member-dashboard-control-centre-loader.js
          test -f dist/media/scripts/member-dashboard-control-centre.js
          test -f dist/media/scripts/member-dashboard-control-centre-polish.js
          test -f dist/media/scripts/member-dashboard-service-shortcuts.js
          test -f dist/media/styles/member-dashboard-control-centre.css
          test -f dist/media/styles/member-dashboard-control-centre-help.css
          test -f dist/media/styles/member-dashboard-control-centre-polish.css
          test -f dist/media/styles/member-dashboard-service-shortcuts.css
          grep -q 'runtime-config' dist/unplug-member-dashboard.html
