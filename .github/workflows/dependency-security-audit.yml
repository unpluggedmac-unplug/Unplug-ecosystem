name: Dependency security remediation validation

on:
  push:
    branches:
      - security-audit-control-centre-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audited release
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Generate lockfile-only audit fix
        shell: bash
        run: |
          set -euo pipefail
          cd unplug-backend
          cp package-lock.json "$RUNNER_TEMP/package-lock.before.json"
          npm audit fix --omit=dev --package-lock-only
          cp package-lock.json "$RUNNER_TEMP/package-lock.candidate.json"
          echo 'Candidate dependency changes:'
          git diff -- package-lock.json
          echo 'Resolved security-sensitive versions:'
          npm ci --omit=dev
          npm ls express body-parser qs nodemailer sharp --all || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/backend-prod-audit-after.json" || true
          jq '.metadata.vulnerabilities // {}' "$RUNNER_TEMP/backend-prod-audit-after.json"
          total=$(jq -r '.metadata.vulnerabilities.total // 0' "$RUNNER_TEMP/backend-prod-audit-after.json")
          if [ "$total" != "0" ]; then
            echo "Security audit still reports $total production vulnerabilities"
            jq -r '.vulnerabilities // {} | to_entries[] | [.key, .value.severity, (.value.fixAvailable|tostring)] | @tsv' "$RUNNER_TEMP/backend-prod-audit-after.json" || true
            exit 1
          fi

      - name: Run complete backend suite against candidate lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd unplug-backend
          npm ci
          npm test

      - name: Save candidate lockfile and audit
        uses: actions/upload-artifact@v4
        with:
          name: dependency-fix-candidate
          path: |
            ${{ runner.temp }}/package-lock.before.json
            ${{ runner.temp }}/package-lock.candidate.json
            ${{ runner.temp }}/backend-prod-audit-after.json
          if-no-files-found: error
          retention-days: 7
