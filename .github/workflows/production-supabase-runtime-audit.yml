name: Production Supabase runtime dependency audit

on:
  push:
    branches:
      - ops/production-inventory-20260911

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan deployed HTML and first-party scripts for Supabase runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin, urlparse
          from urllib.error import HTTPError
          import re, json

          ORIGIN='https://www.unplugnews.com'
          START=[
            '/', '/unplug-magazine.html', '/unplug-member-dashboard.html',
            '/unplug-admin-dashboard.html', '/unplug-agreement.html',
            '/unplug-agreements-admin.html', '/runtime-config'
          ]
          MARKERS=[
            'supabase.co', 'functions/v1', 'submit-card', 'review-card',
            'fkuzbwysvyskhsskjmmi', 'jaywxegcxjgyqhcwzbte',
            'SUPABASE_URL', '@supabase'
          ]

          def fetch(url, limit=5_000_000):
            req=Request(url,headers={'User-Agent':'Unplug-Supabase-Runtime-Audit/1.0','Accept':'*/*'})
            try:
              with urlopen(req,timeout=25) as r:
                return r.status, r.read(limit), r.headers.get('content-type','')
            except HTTPError as e:
              return e.code, e.read(limit), e.headers.get('content-type','')

          scanned={}
          queue=[]
          for p in START:
            queue.append(urljoin(ORIGIN,p))

          while queue and len(scanned) < 80:
            url=queue.pop(0)
            if url in scanned: continue
            status,body,ctype=fetch(url)
            text=body.decode('utf-8','replace')
            scanned[url]=(status,ctype,text)
            if 'html' in ctype.lower() or '<html' in text[:2000].lower():
              for attr in re.findall(r'''(?:src|href)=["']([^"'#?]+)''', text, re.I):
                child=urljoin(url,attr)
                parsed=urlparse(child)
                if parsed.netloc == 'www.unplugnews.com' and parsed.path.lower().endswith(('.js','.mjs')):
                  if child not in scanned and child not in queue:
                    queue.append(child)

          hits=[]
          for url,(status,ctype,text) in scanned.items():
            lower=text.lower()
            for marker in MARKERS:
              if marker.lower() in lower:
                hits.append({'resource':urlparse(url).path or '/', 'marker':marker, 'http':status})

          print('SCANNED_RESOURCES='+str(len(scanned)))
          print('SUPABASE_RUNTIME_HITS='+str(len(hits)))
          for hit in hits:
            print('HIT resource={resource} marker={marker} HTTP={http}'.format(**hit))

          # Do not fail merely because historical/legacy runtime references exist;
          # this job is an inventory sensor. A nonzero result becomes migration work.
          print(json.dumps({'scanned':len(scanned),'hits':hits},sort_keys=True))
          PY
