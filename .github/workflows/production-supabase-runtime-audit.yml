name: Production Supabase runtime dependency audit

on:
  push:
    branches:
      - ops/production-inventory-20260911

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan deployed HTML and first-party scripts for actual Supabase runtime calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import urljoin, urlparse
          from urllib.error import HTTPError
          import re, json

          ORIGIN='https://www.unplugnews.com'
          START=[
            '/', '/unplug-magazine.html', '/unplug-member-dashboard.html',
            '/unplug-admin-dashboard.html', '/unplug-agreement.html',
            '/unplug-agreements-admin.html', '/runtime-config'
          ]
          # Deliberately use exact runtime signatures. Generic words like
          # "review-card" also occur in harmless CSS classes such as
          # "preview-card" and caused a false positive in the first audit.
          PATTERNS={
            'supabase-host': re.compile(r'https?://[a-z0-9-]+\.supabase\.co', re.I),
            'supabase-functions': re.compile(r'/functions/v1/(?:submit-card|review-card)\b', re.I),
            'old-storage-project': re.compile(r'fkuzbwysvyskhsskjmmi\.supabase\.co', re.I),
            'production-project': re.compile(r'jaywxegcxjgyqhcwzbte\.supabase\.co', re.I),
            'supabase-js-client': re.compile(r'@supabase|createClient\s*\(', re.I),
          }

          def fetch(url, limit=5_000_000):
            req=Request(url,headers={'User-Agent':'Unplug-Supabase-Runtime-Audit/1.1','Accept':'*/*'})
            try:
              with urlopen(req,timeout=25) as r:
                return r.status, r.read(limit), r.headers.get('content-type','')
            except HTTPError as e:
              return e.code, e.read(limit), e.headers.get('content-type','')

          scanned={}
          queue=[urljoin(ORIGIN,p) for p in START]
          while queue and len(scanned) < 100:
            url=queue.pop(0)
            if url in scanned: continue
            status,body,ctype=fetch(url)
            text=body.decode('utf-8','replace')
            scanned[url]=(status,ctype,text)
            if 'html' in ctype.lower() or '<html' in text[:2000].lower():
              for attr in re.findall(r'''(?:src|href)=["']([^"'#?]+)''', text, re.I):
                child=urljoin(url,attr)
                parsed=urlparse(child)
                if parsed.netloc == 'www.unplugnews.com' and parsed.path.lower().endswith(('.js','.mjs')):
                  if child not in scanned and child not in queue:
                    queue.append(child)

          hits=[]
          for url,(status,ctype,text) in scanned.items():
            for label,pattern in PATTERNS.items():
              if pattern.search(text):
                hits.append({'resource':urlparse(url).path or '/', 'signature':label, 'http':status})

          print('SCANNED_RESOURCES='+str(len(scanned)))
          print('ACTUAL_SUPABASE_RUNTIME_HITS='+str(len(hits)))
          for hit in hits:
            print('HIT resource={resource} signature={signature} HTTP={http}'.format(**hit))
          print(json.dumps({'scanned':len(scanned),'hits':hits},sort_keys=True))
          PY
