name: Validate temporary Phase 11 staging harness
on:
  push:
    branches: [staging-control-centre, phase11-authenticated-staging-20260910]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json
      - name: Syntax check temporary harness and release gates
        working-directory: unplug-backend
        run: |
          node --check src/app.js
          node --check src/utils/validateEnv.js
          node --check src/phase11Bootstrap.js
          node --check src/utils/phase11AuthenticatedStaging.js
      - name: Confirm package lock remains valid
        working-directory: unplug-backend
        run: npm ci --omit=dev
