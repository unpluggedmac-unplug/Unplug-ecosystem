name: Growth staging runtime smoke v2

on:
  push:
    branches:
      - ops/growth-staging-smoke-20260911-v2

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact staging runtime surfaces
        shell: bash
        run: |
          set -uo pipefail
          BASE='https://staging-control-centre.unplug-magazine.pages.dev'
          API='https://unplug-ecosystem-staging.onrender.com'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          failures=0

          request() {
            local url="$1" out="$2"
            curl --silent --show-error --location --max-time 30 -A 'Unplug-Staging-Smoke/2.1' -o "$out" -w '%{http_code}' "$url"
          }
          check_page() {
            local path="$1" marker="$2" name="$3" out="$TMP/$name"
            local code marker_ok='no'
            code="$(request "$BASE$path" "$out")"
            grep -Fqi "$marker" "$out" && marker_ok='yes'
            echo "$name HTTP=$code marker=$marker_ok bytes=$(wc -c < "$out")"
            if [ "$code" != '200' ] || [ "$marker_ok" != 'yes' ]; then failures=$((failures+1)); fi
          }

          code="$(request "$API/health/ready" "$TMP/ready")"
          ready_ok='no'; grep -q '"status":"ready"' "$TMP/ready" && ready_ok='yes'
          echo "backend-ready HTTP=$code marker=$ready_ok"
          if [ "$code" != '200' ] || [ "$ready_ok" != 'yes' ]; then failures=$((failures+1)); fi

          code="$(request "$BASE/runtime-config" "$TMP/runtime.js")"
          api_ok='no'; ribbon_ok='no'
          grep -q 'https://unplug-ecosystem-staging.onrender.com' "$TMP/runtime.js" && api_ok='yes'
          grep -q 'UNPLUG STAGING.*ISOLATED TEST ENVIRONMENT' "$TMP/runtime.js" && ribbon_ok='yes'
          echo "runtime-config HTTP=$code staging_api=$api_ok ribbon=$ribbon_ok bytes=$(wc -c < "$TMP/runtime.js")"
          if [ "$code" != '200' ] || [ "$api_ok" != 'yes' ] || [ "$ribbon_ok" != 'yes' ]; then failures=$((failures+1)); fi

          check_page '/unplug-growth-application.html' 'My Growth Journey' 'growth-applicant'
          check_page '/unplug-growth-applications-admin.html' 'Growth Applications' 'growth-admin'
          check_page '/unplug-agreement.html' 'Agreement | Unplug Magazine' 'agreement-signer'
          check_page '/unplug-agreements-admin.html' 'Agreement' 'agreement-admin'
          check_page '/growth-integration.js' 'growth' 'growth-integration'

          code="$(request "$BASE/__unplug_release_missing_1937b309__" "$TMP/missing")"
          echo "unknown-route HTTP=$code bytes=$(wc -c < "$TMP/missing")"
          if [ "$code" != '404' ]; then failures=$((failures+1)); fi

          check_page '/' 'Unplug' 'homepage'
          check_page '/unplug-member-dashboard.html' 'Unplug' 'member-dashboard'
          check_page '/unplug-admin-dashboard.html' 'Unplug' 'admin-dashboard'
          check_page '/unplug-checkout.html' 'Unplug' 'checkout'

          echo "TOTAL_FAILURES=$failures"
          if [ "$failures" -ne 0 ]; then
            echo 'FAIL: Cloudflare staging artifact does not yet match the repaired release candidate.'
            exit 1
          fi
          echo 'PASS: staging runtime has Growth + Agreement packaging, isolated API config, staging ribbon and clean 404 behavior.'
