name: Agreement + Growth feature CI

on:
  push:
    branches:
      - feature/agreement-growth-applications-20260910
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agreement-growth-feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check Agreement Forms source
        run: |
          node --check src/app.js
          node --check src/routes/agreementForms.js
          node --check src/routes/agreementPayments.js
          node --check src/middleware/agreementPaymentPolicy.js
          node --check src/utils/agreementDocument.js
          node --check test/agreementPayments.test.js

      - name: PostgreSQL migration sweep
        run: node scripts/sweep-test-postgres.js

      - name: Prepare text-search test fixture
        run: node scripts/ensure-text-search.js

      - name: Full backend test suite
        run: find test -name '*.test.js' -print0 | sort -z | xargs -0 node --test --test-concurrency=1
