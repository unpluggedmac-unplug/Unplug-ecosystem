name: Growth Application feature CI

on:
  push:
    branches:
      - feature/growth-application-20260911
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-application-feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check release source
        run: |
          node --check src/app.js
          node --check src/routes/agreementForms.js
          node --check src/routes/agreementPayments.js
          node --check src/middleware/agreementPaymentPolicy.js
          node --check src/utils/agreementDocument.js
          node --check src/data/growthApplicationQuestions.js
          node --check src/routes/growthApplication.js
          node --check middleware/upload.js 2>/dev/null || true
          node --check src/middleware/upload.js
          node --check test/growthApplicationQuestions.test.js

      - name: PostgreSQL migration sweep
        run: node scripts/sweep-test-postgres.js

      - name: Prepare text-search test fixture
        run: node scripts/ensure-text-search.js

      - name: Full backend test suite
        id: fulltests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          find test -name '*.test.js' -print0 | sort -z | xargs -0 node --test --test-concurrency=1 2>&1 | tee /tmp/unplug-ci-tests.log

      - name: Capture failing test diagnostics
        if: steps.fulltests.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "# Temporary CI failure diagnostics"
            echo
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "## Failure markers"
            echo '```text'
            grep -n -B 20 -A 60 -E '(^not ok |ERR_|AssertionError|error:|failureType:|expected:|actual:)' /tmp/unplug-ci-tests.log || true
            echo '```'
            echo
            echo "## Test summary"
            echo '```text'
            tail -n 80 /tmp/unplug-ci-tests.log
            echo '```'
          } > ../CI-FAILURE-DIAGNOSTICS.md
          git config user.name "unplug-ci-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add ../CI-FAILURE-DIAGNOSTICS.md
          git commit -m "ci: capture Growth Application failure diagnostics [skip ci]" || true
          git push origin HEAD:feature/growth-application-20260911

      - name: Enforce backend test result
        if: steps.fulltests.outcome == 'failure'
        run: exit 1

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
