name: Frontend hotfix independent staging CI

on:
  push:
    branches:
      - ops/frontend-hotfix-staging-smoke
  workflow_dispatch:

jobs:
  staging-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-control-centre
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build staging candidate and enforce dist closure
        run: npm run build
      - name: Assert repaired assets exist
        run: |
          test -s dist/unplug-site-buttons.js
          test -s dist/unplug-shared.css
          test -s dist/unplug-magazine.html
          test -s dist/unplug-checkout.html
          test -s dist/unplug-vote.html
          echo "Staging frontend package is complete."
      - name: Record exact staging SHA
        run: |
          echo "STAGING_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "d3b84fed9166c552ad39d034e77b07a24fa72cd1"

  staging-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: unplug-backend
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-control-centre
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json
      - run: npm ci
      - run: node --check src/app.js
      - run: node scripts/sweep-test-postgres.js
      - run: node scripts/ensure-text-search.js
      - name: Full backend regression suite
        shell: bash
        run: |
          set -o pipefail
          find test -name '*.test.js' -print0 | sort -z | xargs -0 node --test --test-concurrency=1
      - name: Record exact staging SHA
        run: |
          echo "STAGING_SHA=$(git -C .. rev-parse HEAD)"
          test "$(git -C .. rev-parse HEAD)" = "d3b84fed9166c552ad39d034e77b07a24fa72cd1"
