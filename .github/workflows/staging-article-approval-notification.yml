name: Staging article approval notification

on:
  push:
    branches:
      - staging-notify-article-approval-20260910
    paths:
      - .github/workflows/staging-article-approval-notification.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated staging fix branch
        uses: actions/checkout@v4
        with:
          ref: staging-notify-article-approval-20260910
          fetch-depth: 0

      - name: Apply isolated patch
        run: python .github/scripts/patch-article-approval-notification.py

      - name: Install backend dependencies
        working-directory: unplug-backend
        run: npm ci

      - name: Run complete backend test suite
        working-directory: unplug-backend
        run: npm test

      - name: Commit validated fix
        run: |
          git config user.name "unpluggedmac-unplug"
          git config user.email "unpluggedmac@gmail.com"
          git rm .github/workflows/staging-article-approval-notification.yml
          git rm .github/scripts/patch-article-approval-notification.py
          git add unplug-backend/src/routes/admin.js unplug-backend/test/articleApprovalNotification.test.js
          git commit -m "Notify members when articles are approved"
          git push origin HEAD:staging-notify-article-approval-20260910
