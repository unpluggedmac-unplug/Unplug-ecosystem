name: One-time signup email UI truthfulness fix

on:
  push:
    branches:
      - staging-control-centre

permissions:
  contents: write

jobs:
  patch-signup-ui:
    if: github.ref == 'refs/heads/staging-control-centre'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-control-centre

      - name: Apply exact staging-only UI patch and regression test
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path('unplug-member-dashboard.html')
          text = dashboard.read_text()
          old = """    await api('/auth/register', { method: 'POST', body: JSON.stringify({ email, password, phone, fullName, memberType: SELECTED_MEMBER_TYPE }) });
              localStorage.setItem('unplug_api_base', API_BASE);
              PENDING_VERIFY_EMAIL = email;
              document.getElementById('verifySub').textContent = `We sent a 6-digit code to ${email}. Enter it below to activate your free account.`;
          """
          new = """    const registration = await api('/auth/register', { method: 'POST', body: JSON.stringify({ email, password, phone, fullName, memberType: SELECTED_MEMBER_TYPE }) });
              localStorage.setItem('unplug_api_base', API_BASE);
              PENDING_VERIFY_EMAIL = email;
              document.getElementById('verifySub').textContent = registration.emailSent === false
                ? `Your account was created, but the verification email could not be delivered to ${email} right now. Use “Resend Code” in a moment, or contact us if it keeps failing.`
                : `We sent a 6-digit code to ${email}. Enter it below to activate your free account.`;
          """
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('Refusing patch: signup UI block matched more than once')
              dashboard.write_text(text.replace(old, new, 1))
          elif 'registration.emailSent === false' not in text:
              raise SystemExit('Refusing patch: expected signup UI block was not found')

          test_path = Path('unplug-backend/test/signupUiEmailDelivery.test.js')
          test_path.write_text("""const { test } = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('fs');
          const path = require('path');

          test('signup UI does not claim a verification email was sent when delivery was simulated or failed', () => {
            const html = fs.readFileSync(path.join(__dirname, '..', '..', 'unplug-member-dashboard.html'), 'utf8');
            assert.match(html, /const registration = await api\('\/auth\/register'/);
            assert.match(html, /registration\.emailSent === false/);
            assert.match(html, /verification email could not be delivered/);
          });
          """)

          # Delete this one-time workflow in the same commit that carries the
          # tested fix. The running job keeps its already-loaded definition,
          # while the next branch state contains only the normal safety workflow.
          Path('.github/workflows/one-time-signup-ui-email-fix.yml').unlink()

      - name: Check patch formatting
        run: git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: unplug-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: unplug-backend
        run: npm ci

      - name: Run signup email UI regression test
        working-directory: unplug-backend
        run: node --test --test-concurrency=1 test/signupUiEmailDelivery.test.js

      - name: Commit tested fix to staging only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'unplug-staging-safety'
          git config user.email 'actions@users.noreply.github.com'
          git add unplug-member-dashboard.html unplug-backend/test/signupUiEmailDelivery.test.js .github/workflows/one-time-signup-ui-email-fix.yml
          git commit -m 'Make signup email delivery messaging truthful'
          git push origin HEAD:staging-control-centre
