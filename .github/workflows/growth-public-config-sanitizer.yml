name: Growth public-config sanitizer

on:
  push:
    branches:
      - feature/growth-application-20260911
    paths:
      - .github/workflows/growth-public-config-sanitizer.yml

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/growth-application-20260911
      - name: Remove private short code from public config
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('unplug-backend/src/routes/growthApplication.js')
          s = p.read_text()
          old = """    const [visibility, responseDays, shortCode, placements] = await Promise.all([\n      getSetting('growth_application_site_visibility', 'hidden'),\n      getSetting('growth_application_response_days', '5'),\n      getSetting('growth_application_short_code', ''),\n      pool.query('SELECT page_key,enabled FROM growth_application_placements ORDER BY page_key'),\n    ]);\n    return res.json({\n      site_visibility: visibility,\n      response_days: Number(responseDays || 5),\n      current_short_code: shortCode || null,\n      placements: placements.rows,\n"""
          new = """    const [visibility, responseDays, placements] = await Promise.all([\n      getSetting('growth_application_site_visibility', 'hidden'),\n      getSetting('growth_application_response_days', '5'),\n      pool.query('SELECT page_key,enabled FROM growth_application_placements ORDER BY page_key'),\n    ]);\n    return res.json({\n      site_visibility: visibility,\n      response_days: Number(responseDays || 5),\n      placements: placements.rows,\n"""
          if old not in s:
              raise SystemExit('Expected public-config block not found; refusing non-deterministic patch.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit sanitization
        run: |
          git config user.name "unplug-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add unplug-backend/src/routes/growthApplication.js
          git commit -m "fix: keep Growth short codes out of public config [skip ci]"
          git push origin HEAD:feature/growth-application-20260911
