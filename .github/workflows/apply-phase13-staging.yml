name: Install Phase 13 staging release

on:
  push:
    branches:
      - staging-control-centre
    paths:
      - 'Unplug-ecosystem-control-centre-phase13-security-csp.zip'

permissions:
  contents: write

jobs:
  install-phase13:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-control-centre
          fetch-depth: 0

      - name: Validate and install Phase 13 release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ZIP='Unplug-ecosystem-control-centre-phase13-security-csp.zip'
          rm -rf /tmp/unplug-phase13
          mkdir -p /tmp/unplug-phase13
          unzip -q "$RELEASE_ZIP" -d /tmp/unplug-phase13
          test -f /tmp/unplug-phase13/phase12work/CONTROL-CENTRE-PHASE13.md
          test -f /tmp/unplug-phase13/phase12work/unplug-admin-dashboard.html
          test -f /tmp/unplug-phase13/phase12work/functions/_middleware.js
          test -f /tmp/unplug-phase13/phase12work/unplug-backend/db/migrations/187_payment_fulfilment_tracking.sql
          cp -a /tmp/unplug-phase13/phase12work/. ./
          rm -rf .phase13
          rm -f "$RELEASE_ZIP"
          rm -f .github/workflows/apply-phase13-staging.yml

      - name: Commit Phase 13 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Unplug Control Centre Phase 13 to staging"
          git push origin HEAD:staging-control-centre
