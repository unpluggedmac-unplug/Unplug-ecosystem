name: Apply Phase 13 staging patch

on:
  push:
    branches:
      - staging-control-centre
    paths:
      - '.phase13/READY'

permissions:
  contents: write

jobs:
  apply-phase13:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-control-centre
          fetch-depth: 0

      - name: Reconstruct and apply Phase 13 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase13/part-* > /tmp/phase13.patch
          git apply --check /tmp/phase13.patch
          git apply /tmp/phase13.patch
          rm -rf .phase13
          rm -f .github/workflows/apply-phase13-staging.yml

      - name: Commit Phase 13 source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Unplug Control Centre Phase 13 to staging"
          git push origin HEAD:staging-control-centre
