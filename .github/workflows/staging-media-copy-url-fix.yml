name: One-time staging media copy URL fix

on:
  push:
    branches: [staging-control-centre]
    paths:
      - '.github/workflows/staging-media-copy-url-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-control-centre
          fetch-depth: 0

      - name: Fix Media Library Copy URL handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('unplug-admin-dashboard.html')
          s = p.read_text()
          old = 'onclick="mlCopyUrl(${JSON.stringify(a.url)})"'
          new = 'onclick="mlCopyUrlById(${a.id})"'
          if old not in s:
              raise SystemExit('Expected Copy URL handler not found')
          s = s.replace(old, new, 1)
          marker = 'async function mlCopyUrl(url) {'
          helper = """function mlCopyUrlById(id) {\n  const a = _mlItems.find((x) => Number(x.id) === Number(id));\n  if (!a || !a.url) { showToast('Image URL is unavailable.', true); return; }\n  return mlCopyUrl(a.url);\n}\n\n"""
          if 'function mlCopyUrlById(id)' not in s:
              if marker not in s:
                  raise SystemExit('mlCopyUrl function marker not found')
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY

      - name: Validate staging frontend
        run: |
          git diff --check
          node scripts/staging-frontend-check.js

      - name: Commit fix
        run: |
          git config user.name 'unplug-staging-bot'
          git config user.email 'unplug-staging-bot@users.noreply.github.com'
          git add unplug-admin-dashboard.html
          git commit -m 'Fix Media Library Copy URL button'
          git push origin HEAD:staging-control-centre
