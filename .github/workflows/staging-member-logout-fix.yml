name: One-time deterministic member logout fix

on:
  push:
    branches: [staging-control-centre]
    paths:
      - '.github/workflows/staging-member-logout-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-control-centre
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic member logout patch
        run: node .github/scripts/patch-member-logout.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend guard and build
        run: |
          npm run staging:check
          npm run security:check
          npm run build

      - name: Run logout and reset regression guard
        working-directory: unplug-backend
        run: node --test test/passwordResetAndLogoutUiGuard.test.js

      - name: Commit tested fix
        run: |
          rm -f .github/workflows/staging-member-logout-fix.yml .github/scripts/patch-member-logout.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unplug-member-dashboard.html unplug-backend/test/passwordResetAndLogoutUiGuard.test.js .github/workflows/staging-member-logout-fix.yml .github/scripts/patch-member-logout.js
          git commit -m 'Make member logout return deterministically to Sign In'
          git push origin HEAD:staging-control-centre
