name: Assemble Control Centre production release

on:
  push:
    branches:
      - production-control-centre-release-20260910
    paths:
      - '.github/workflows/assemble-control-centre-production.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated production release branch
        uses: actions/checkout@v4
        with:
          ref: production-control-centre-release-20260910
          fetch-depth: 0

      - name: Fetch tested boundary and recovery hotfix
        run: |
          set -euo pipefail
          git fetch origin control-centre-release-boundary-20260910 production-backup-hotfix-20260909 --no-tags

      - name: Merge tested Control Centre boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Merge the exact tested boundary. This intentionally stops before
          # Daily Shout-Out migration 188 and all later staging-only work.
          git merge --no-ff --no-commit origin/control-centre-release-boundary-20260910 || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            expected='unplug-backend/src/routes/uploads.js'
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflict(s):"
              echo "$conflicts"
              exit 1
            fi

            # uploads.js has two legitimate independent histories:
            # 1) production removed Supabase Storage and became R2-only;
            # 2) Control Centre added Media Library indexing + responsive image
            #    metadata on upload.
            # Start from the known-good production R2-only file, then apply only
            # the tested Control Centre upload-indexing changes explicitly.
            file='unplug-backend/src/routes/uploads.js'
            git checkout --ours -- "$file"

            python3 - <<'PY'
            from pathlib import Path

            path = Path('unplug-backend/src/routes/uploads.js')
            s = path.read_text()

            if "const pool = require('../db');" not in s:
                needle = "const fs = require('fs');\n"
                if needle not in s:
                    raise SystemExit('uploads merge: fs import anchor not found')
                s = s.replace(needle, needle + "const pool = require('../db');\n", 1)

            if 'async function indexPublicUpload' not in s:
                anchor = "// A second, PRIVATE bucket — used only for the full-quality edition PDF\n"
                if anchor not in s:
                    raise SystemExit('uploads merge: private bucket anchor not found')
                helper = """// Best-effort catalogue entry for the Admin Media Library. Upload success must
// never be turned into upload failure merely because a migration has not yet
// run on an environment, so indexing errors are logged and swallowed.
async function indexPublicUpload({ url, filename, storage, mimetype, sizeBytes, uploadedBy, width, height }) {
  try {
    await pool.query(`INSERT INTO media_assets
      (url, filename, storage, mime_type, size_bytes, width, height, uploaded_by)
      VALUES ($1,$2,$3,$4,$5,$6,$7,$8)
      ON CONFLICT (url) DO UPDATE SET
        filename=COALESCE(EXCLUDED.filename, media_assets.filename),
        storage=COALESCE(EXCLUDED.storage, media_assets.storage),
        mime_type=COALESCE(EXCLUDED.mime_type, media_assets.mime_type),
        size_bytes=COALESCE(EXCLUDED.size_bytes, media_assets.size_bytes),
        width=COALESCE(EXCLUDED.width, media_assets.width),
        height=COALESCE(EXCLUDED.height, media_assets.height),
        uploaded_by=COALESCE(media_assets.uploaded_by, EXCLUDED.uploaded_by),
        updated_at=now()`,
      [url, filename || null, storage || null, mimetype || null, sizeBytes || null,
       width || null, height || null, uploadedBy || null]);
  } catch (err) {
    console.warn('[media library] upload was saved but could not be indexed:', err.message);
  }
}

"""
                s = s.replace(anchor, helper + anchor, 1)

            old = """    if (r2Configured) {
      try {
        const { url } = await uploadPublicFile(req.file);
        return res.status(201).json({ url, filename: req.file.filename, sizeBytes: req.file.size, storage: 'r2' });
      } catch (e) {
"""
            new = """    if (r2Configured) {
      try {
        const { url, key, buffer } = await uploadPublicFile(req.file);
        let derivatives = null;
        try {
          derivatives = await storeDerivatives({ key, buffer, putObject: putPublicObject });
        } catch (derr) {
          console.error('[uploads] derivatives failed for', key, '-', derr.message);
        }
        await indexPublicUpload({
          url, filename: req.file.filename, storage: 'r2', mimetype: req.file.mimetype,
          sizeBytes: req.file.size, uploadedBy: req.user && req.user.id,
          width: derivatives && derivatives.meta && derivatives.meta.width,
          height: derivatives && derivatives.meta && derivatives.meta.height,
        });
        return res.status(201).json({
          url, filename: req.file.filename, sizeBytes: req.file.size, storage: 'r2',
          responsive: derivatives && derivatives.made > 0
            ? { widths: derivatives.widths, formats: derivatives.formats }
            : null,
        });
      } catch (e) {
"""
            if old not in s:
                raise SystemExit('uploads merge: R2 image upload block anchor not found')
            s = s.replace(old, new, 1)

            old_local = """    const proto = (req.get('x-forwarded-proto') || req.protocol || 'https').split(',')[0].trim();
    const url = `${proto}://${req.get('host')}/uploads/${req.file.filename}`;
    res.status(201).json({
"""
            new_local = """    const proto = (req.get('x-forwarded-proto') || req.protocol || 'https').split(',')[0].trim();
    const url = `${proto}://${req.get('host')}/uploads/${req.file.filename}`;
    await indexPublicUpload({
      url, filename: req.file.filename, storage: 'local',
      mimetype: req.file.mimetype, sizeBytes: req.file.size,
      uploadedBy: req.user && req.user.id,
    });
    res.status(201).json({
"""
            if old_local not in s:
                raise SystemExit('uploads merge: local image upload block anchor not found')
            s = s.replace(old_local, new_local, 1)

            path.write_text(s)
            PY

            git add "$file"
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Preserve production migration replay hotfixes
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            unplug-backend/db/migrations/010_new_pricing_model.sql \
            unplug-backend/db/migrations/046_consultant_role.sql \
            unplug-backend/db/migrations/049_article_drafts.sql \
            unplug-backend/db/migrations/053_ad_slots_rotation.sql
          do
            git show 6a8d5b3ce806859cea50ec49f96efb7081f6e442:"$file" > "$file"
            git add "$file"
          done

      - name: Release boundary guards
        shell: bash
        run: |
          set -euo pipefail
          test -f unplug-backend/db/migrations/176_admin_content_trash.sql
          test -f unplug-backend/db/migrations/183_media_library.sql
          test -f unplug-backend/db/migrations/184_page_cms_drafts.sql
          test -f unplug-backend/db/migrations/185_staff_roles_permissions.sql
          test -f unplug-backend/db/migrations/186_ad_banner_campaign_manager.sql
          test -f unplug-backend/db/migrations/187_payment_fulfilment_tracking.sql
          test ! -f unplug-backend/db/migrations/188_daily_shoutout_social_system.sql

          grep -q 'async function uploadPublicFile' unplug-backend/src/routes/uploads.js
          grep -q 'async function indexPublicUpload' unplug-backend/src/routes/uploads.js
          if grep -q 'SUPABASE_SERVICE_KEY' unplug-backend/src/routes/uploads.js; then
            echo 'R2-only production storage was lost during merge.'
            exit 1
          fi
          node --check unplug-backend/src/routes/uploads.js
          node --check unplug-backend/src/app.js

      - name: Frontend install, security check and build
        run: |
          set -euo pipefail
          npm ci
          npm run security:check
          npm run build

      - name: Backend install and test suite
        working-directory: unplug-backend
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Commit isolated release assembly
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/assemble-control-centre-production.yml
          git add -A
          git commit -m "Assemble tested Control Centre production release"
          git push origin HEAD:production-control-centre-release-20260910
