name: Staging member change editor hotfix

on:
  push:
    branches:
      - staging-control-centre
    paths:
      - .github/workflows/staging-member-change-editor-hotfix.yml
      - scripts/staging-member-change-editor-hotfix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-control-centre
      - name: Apply patch
        run: python3 scripts/staging-member-change-editor-hotfix.py
      - name: Validate frontend
        run: |
          git diff --check
          node scripts/staging-frontend-check.js
      - name: Commit patch
        run: |
          git config user.name unplug-staging-bot
          git config user.email unplug-staging-bot@users.noreply.github.com
          git add unplug-member-dashboard.html
          if git diff --cached --quiet; then
            echo "No change needed."
          else
            git commit -m "Fix member article change-request editor"
            git push origin HEAD:staging-control-centre
          fi
