name: One-time staging admin publish diagnostic

on:
  push:
    branches: [staging-control-centre]
    paths:
      - '.github/workflows/staging-admin-publish-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-control-centre
      - name: Inspect publish section and router
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('unplug-admin-dashboard.html')
          s=p.read_text()
          print('section-publish count:', s.count('id="section-publish"'))
          print('Articles & Publishing nav count:', s.count('data-section="publish"'))
          print('admin-section count:', s.count('class="admin-section'))
          pats=[
            r"querySelectorAll\([^\n]*data-section[^\n]*\)",
            r"getElementById\(['\"]section-['\"]",
            r"section-\s*\+",
            r"dataset\.section",
            r"loadEmailStatus\(\)",
            r"loadArticles",
            r"loadArticle",
          ]
          lines=s.splitlines()
          for pat in pats:
            print('\nPATTERN',pat)
            for m in re.finditer(pat,s):
              line=s.count('\n',0,m.start())+1
              print(' line',line, lines[line-1][:240])
          # print all lines around every dataset.section occurrence
          for i,l in enumerate(lines,1):
            if 'dataset.section' in l or "[data-section]" in l or "a[data-section]" in l:
              print('\n--- context around',i,'---')
              for j in range(max(1,i-6), min(len(lines),i+12)+1):
                print(f'{j}: {lines[j-1]}')
          PY
