name: One-time staging auth UX fix

on:
  push:
    branches: [staging-control-centre]
    paths:
      - '.github/workflows/staging-auth-ux-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: staging-control-centre
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply logout and reset-code fixes
        run: python3 scripts/staging-auth-ux-fix.py

      - name: Install backend dependencies
        working-directory: unplug-backend
        run: npm ci --omit=dev

      - name: Run targeted auth UX guards
        working-directory: unplug-backend
        run: node --test test/passwordResetAndLogoutUiGuard.test.js

      - name: Run complete backend test suite
        working-directory: unplug-backend
        run: npm test

      - name: Commit tested staging fix and remove one-time helpers
        shell: bash
        run: |
          rm .github/workflows/staging-auth-ux-fix.yml scripts/staging-auth-ux-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unplug-backend/src/routes/auth.js unplug-backend/src/middleware/rateLimit.js unplug-member-dashboard.html unplug-backend/test/passwordResetAndLogoutUiGuard.test.js .github/workflows/staging-auth-ux-fix.yml scripts/staging-auth-ux-fix.py
          git commit -m "Fix member logout and use six-digit password reset codes"
          git push origin HEAD:staging-control-centre
