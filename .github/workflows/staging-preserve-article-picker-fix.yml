name: One-time staging article picker fix

on:
  push:
    branches: [staging-control-centre]
    paths:
      - '.github/workflows/staging-preserve-article-picker-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-control-centre
      - name: Preserve current article after save
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('unplug-admin-dashboard.html')
          s = p.read_text()

          start = s.index('async function artLoadPickList()')
          end = s.index("\ndocument.getElementById('artLoadBtn')", start)
          block = s[start:end]
          block = block.replace(
              "async function artLoadPickList() {\n  const sel = document.getElementById('artPick');",
              "async function artLoadPickList(keepId) {\n  const sel = document.getElementById('artPick');\n  // Rebuilding the options used to jump the picker back to ‘new article’\n  // immediately after a successful save, even though the editor was still\n  // editing the saved article. Preserve that selection so Save → Load is\n  // deterministic and the screen tells the truth about what is open.\n  const selected = keepId != null ? String(keepId) : sel.value;"
          )
          needle = "        }).join('');\n"
          if block.count(needle) != 1:
              raise SystemExit('article picker insertion point changed')
          block = block.replace(
              needle,
              needle + "    if (selected && [...sel.options].some((o) => o.value === selected)) sel.value = selected;\n",
              1,
          )
          s = s[:start] + block + s[end:]

          save_start = s.index('async function artSave(asDraft)')
          save_end = s.index('\nfunction artApplyStatusUi', save_start)
          save_block = s[save_start:save_end]
          old = '    artLoadPickList();\n    loadApprovalQueue();'
          if old not in save_block:
              raise SystemExit('artSave refresh call changed')
          save_block = save_block.replace(
              old,
              '    await artLoadPickList(ART_EDITING_ID);\n    loadApprovalQueue();',
              1,
          )
          s = s[:save_start] + save_block + s[save_end:]
          p.write_text(s)

          # Static regression assertions for the exact UX failure found in smoke #10.
          out = p.read_text()
          assert 'async function artLoadPickList(keepId)' in out
          assert 'const selected = keepId != null ? String(keepId) : sel.value;' in out
          assert 'await artLoadPickList(ART_EDITING_ID);' in out
          print('article picker preservation patch applied')
          PY
          git diff --check
          node scripts/staging-frontend-check.js
      - name: Commit staging-only fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add unplug-admin-dashboard.html
          git commit -m 'Preserve article picker after draft save'
          git push origin HEAD:staging-control-centre
