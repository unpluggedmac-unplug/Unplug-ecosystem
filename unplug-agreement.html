<!doctype html>
<html lang="en">
<head>
  <script src="/runtime-config"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Agreement | Unplug Magazine</title>
  <style>
    :root{--ink:#000001;--paper:#ebe9e9;--hot:#ff2f00;--deep:#e83b00;--orange:#ff4d00;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{background:var(--ink);color:#fff;padding:18px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--hot)}.wrap{max-width:900px;margin:36px auto;padding:0 18px 70px}.card{background:#fff;border:1px solid #d6d2d0;border-radius:18px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.06);margin-bottom:18px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--deep);font-weight:800}.title{font-size:clamp(30px,6vw,56px);line-height:.95;margin:8px 0 14px}.muted{color:#625e5b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 7px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #bbb5b0;border-radius:10px;background:#fff;font:inherit}.field textarea{min-height:110px;resize:vertical}.check{display:flex;gap:10px;align-items:flex-start}.check input{width:auto;margin-top:3px}.terms{white-space:pre-wrap;line-height:1.55;border-left:4px solid var(--hot);padding-left:16px}.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:900;cursor:pointer}.primary{background:var(--hot);color:#fff}.secondary{background:var(--ink);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.alert{padding:12px 14px;border-radius:10px;margin:12px 0;background:#fff0ec;border:1px solid #ffc5b7}.ok{background:#effbf1;border-color:#b4e7bb}.paybox{background:#fff8ef;border:1px solid #ffc58f;padding:16px;border-radius:12px}.bank{font-family:ui-monospace,monospace;white-space:pre-wrap}.signature{border:1px dashed #888;border-radius:10px;background:#fff;touch-action:none;width:100%;height:170px}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{padding:8px 12px;border-radius:999px;border:1px solid #aaa;background:#fff;cursor:pointer}.hidden{display:none!important}.receipt a{font-weight:800;color:var(--deep)}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:20px}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header class="top"><div class="brand">UNPLUG <b>MAGAZINE</b></div><div id="env"></div></header>
<main class="wrap"><div id="status" class="alert hidden"></div><section id="app" class="card"><p>Loading agreement…</p></section></main>
<script>
(function(){
  const q=new URLSearchParams(location.search); const slug=q.get('slug'); const token=q.get('token')||sessionStorage.getItem('agreement_signing_token_'+slug)||'';
  const api=String(window.UNPLUG_RUNTIME_API||'https://unplug-ecosystem.onrender.com').replace(/\/$/,'');
  const auth=localStorage.getItem('accessToken')||localStorage.getItem('adminAccessToken')||'';
  const headers=(json=true)=>Object.assign(json?{'Content-Type':'application/json'}:{},auth?{Authorization:'Bearer '+auth}:{});
  const app=document.getElementById('app'), status=document.getElementById('status');
  document.getElementById('env').textContent=window.UNPLUG_ENV==='staging'?'STAGING':'';
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function msg(t,ok=false){status.textContent=t;status.className='alert '+(ok?'ok':'');status.classList.remove('hidden');status.scrollIntoView({behavior:'smooth',block:'center'});}
  async function req(path,opt={}){const r=await fetch(api+path,opt);const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json().catch(()=>({})):await r.text();if(!r.ok)throw Object.assign(new Error((d&&d.error)||('Request failed ('+r.status+')')),{status:r.status,data:d});return d;}
  function fieldHtml(f){const n='f_'+f.key, ph=esc(f.placeholder||''), required=f.required?'required':'';let control='';
    if(f.kind==='textarea')control=`<textarea id="${n}" ${required} maxlength="${f.maxLength||10000}" placeholder="${ph}"></textarea>`;
    else if(f.kind==='select')control=`<select id="${n}" ${required}><option value="">Choose…</option>${(f.options||[]).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
    else if(f.kind==='radio')control=(f.options||[]).map(o=>`<label class="check"><input type="radio" name="${n}" value="${esc(o)}" ${required}> ${esc(o)}</label>`).join('');
    else if(f.kind==='checkbox')control=`<label class="check"><input id="${n}" type="checkbox" ${required}> <span>${esc(f.label)}</span></label>`;
    else if(f.kind==='file')control=`<input id="${n}" type="url" placeholder="Sign in and upload through your Unplug account, then paste the stored file URL">`;
    else control=`<input id="${n}" type="${['email','phone','number','date'].includes(f.kind)?(f.kind==='phone'?'tel':f.kind):'text'}" ${required} maxlength="${f.maxLength||5000}" placeholder="${ph}">`;
    return `<div class="field">${f.kind==='checkbox'?'':`<label for="${n}">${esc(f.label)}${f.required?' *':''}</label>`}${control}${f.help?`<small class="muted">${esc(f.help)}</small>`:''}</div>`;
  }
  function answer(f){const n='f_'+f.key;if(f.kind==='radio'){const e=document.querySelector(`input[name="${n}"]:checked`);return e?e.value:null}const e=document.getElementById(n);if(!e)return null;return f.kind==='checkbox'?e.checked:e.value.trim();}
  let agreement,payOptions,signingToken=token,drawn=false;
  async function load(){if(!slug){app.innerHTML='<h1>Agreement link incomplete</h1><p>This link does not contain an agreement address.</p>';return}try{[agreement,payOptions]=await Promise.all([req('/agreement-forms/'+encodeURIComponent(slug)),req('/agreement-payments/'+encodeURIComponent(slug)+'/options')]);render();if(signingToken&&agreement.paymentMode==='before_sign')checkPayment();}catch(e){app.innerHTML=`<h1>Agreement unavailable</h1><p>${esc(e.message)}</p>`;}}
  function render(){const paid=Number(agreement.amount)>0&&agreement.paymentMode!=='none'; const blocked=!agreement.open;
    app.innerHTML=`<div class="eyebrow">Agreement · Version ${esc(agreement.version)}</div><h1 class="title">${esc(agreement.title)}</h1><p class="muted">${esc(agreement.description||'Please review the agreement carefully before signing.')}</p>
    ${paid?`<div class="paybox"><strong>Payment:</strong> R${Number(agreement.amount).toFixed(2)} · ${agreement.paymentMode==='before_sign'?'payment before signing':'sign first, then payment'}</div>`:''}
    ${agreement.howItWorks?.length?`<h2>How it works</h2><ol>${agreement.howItWorks.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}
    ${agreement.rules?`<h2>Rules</h2><div class="terms">${esc(agreement.rules)}</div>`:''}${agreement.terms?`<h2>Terms</h2><div class="terms">${esc(agreement.terms)}</div>`:''}
    ${blocked?`<div class="alert">This agreement is not currently open for signatures.</div>`:''}
    <form id="form" class="${blocked?'hidden':''}"><h2>Your details</h2><div class="grid"><div class="field"><label>Signer name *</label><input id="signerName" required></div><div class="field"><label>Email</label><input id="signerEmail" type="email"></div></div>
    <div id="dynamic">${agreement.fields.map(fieldHtml).join('')}</div>
    ${agreement.signerType==='business'?`<div class="field"><label>Signatory capacity</label><input id="capacity" placeholder="Director, owner, authorised representative…"></div>`:''}
    ${agreement.requireWitness?`<h3>Witness</h3><div class="grid"><div class="field"><label>Witness name *</label><input id="witnessName"></div><div class="field"><label>Witness signature *</label><input id="witnessSignature"></div></div>`:''}
    ${agreement.minAge?`<details><summary>Parent / guardian details (only if required)</summary><div class="grid"><div class="field"><label>Guardian name</label><input id="guardianName"></div><div class="field"><label>Relationship</label><input id="guardianRelationship"></div><div class="field"><label>Guardian email</label><input id="guardianEmail" type="email"></div><div class="field"><label>Guardian signature</label><input id="guardianSignatureText"></div></div></details>`:''}
    ${agreement.requireCompanyStamp?`<div class="field"><label>Company stamp image *</label><input id="companyStamp" type="file" accept="image/png,image/jpeg,image/webp"></div>`:''}
    <h2>Signature</h2><div class="tabs"><button type="button" id="typedTab">Type signature</button><button type="button" id="drawTab">Draw signature</button></div><div id="typedBox" class="field"><label>Type your full signature *</label><input id="signatureText"></div><div id="drawBox" class="hidden"><canvas id="canvas" class="signature"></canvas><button type="button" id="clear" class="btn">Clear</button></div>
    ${agreement.paymentMode==='before_sign'&&paid?`<div id="beforePay" class="paybox"><h3>Payment required before signing</h3><p>Start an EFT payment. Once Unplug confirms it, this page unlocks signing.</p><div class="grid"><div class="field"><label>Payer name</label><input id="payerName"></div><div class="field"><label>Payer email</label><input id="payerEmail" type="email"></div></div><label class="check"><input id="termsAccepted" type="checkbox"> I accept the current Unplug Terms & Conditions and Cancellation, Refund & Account Credit Policy.</label><p><button id="payBtn" type="button" class="btn secondary">Start / resume EFT</button></p><div id="payState"></div></div>`:''}
    <label class="check"><input id="confirm" type="checkbox" required> I confirm that the information is correct and I agree to the agreement above.</label><p><button id="signBtn" class="btn primary" ${agreement.paymentMode==='before_sign'&&paid?'disabled':''}>Sign agreement</button></p></form><div id="done"></div>`;
    document.getElementById('form')?.addEventListener('submit',sign);document.getElementById('typedTab')?.addEventListener('click',()=>toggleDraw(false));document.getElementById('drawTab')?.addEventListener('click',()=>toggleDraw(true));document.getElementById('payBtn')?.addEventListener('click',startPayment);setupCanvas();
  }
  function toggleDraw(v){drawn=v;document.getElementById('typedBox').classList.toggle('hidden',v);document.getElementById('drawBox').classList.toggle('hidden',!v)}
  function setupCanvas(){const c=document.getElementById('canvas');if(!c)return;const ctx=c.getContext('2d');function size(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2.2;ctx.lineCap='round'}size();let down=false,last;function p(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function start(e){down=true;last=p(e);e.preventDefault()}function move(e){if(!down)return;const n=p(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(n.x,n.y);ctx.stroke();last=n;e.preventDefault()}function end(){down=false}c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);window.addEventListener('pointerup',end);document.getElementById('clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height)}
  function fileData(id){return new Promise((resolve,reject)=>{const f=document.getElementById(id)?.files?.[0];if(!f)return resolve(null);if(f.size>2*1024*1024)return reject(new Error('Image must be smaller than 2 MB.'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('Could not read image.'));r.readAsDataURL(f)})}
  async function startPayment(){try{const body={method:'eft',termsAccepted:document.getElementById('termsAccepted').checked,payerName:document.getElementById('payerName').value,payerEmail:document.getElementById('payerEmail').value};if(signingToken)body.signingToken=signingToken;const d=await req('/agreement-payments/'+encodeURIComponent(slug)+'/start',{method:'POST',headers:headers(),body:JSON.stringify(body)});signingToken=d.signingToken||signingToken;if(signingToken)sessionStorage.setItem('agreement_signing_token_'+slug,signingToken);const ins=d.instructions;document.getElementById('payState').innerHTML=`<p><strong>${esc(d.payment.statusLabel)}</strong> · Reference ${esc(d.payment.reference)}</p>${ins?`<div class="bank">${esc(typeof ins==='string'?ins:JSON.stringify(ins,null,2))}</div>`:''}<p>Keep this page open or return using the same browser. Signing unlocks after payment confirmation.</p>`;checkPayment();}catch(e){msg(e.message)}}
  async function checkPayment(){if(!signingToken)return;try{const d=await req('/agreement-payments/'+encodeURIComponent(slug)+'/session/'+encodeURIComponent(signingToken));const el=document.getElementById('payState');if(el)el.insertAdjacentHTML('beforeend',`<p>Status: <strong>${esc(d.paymentStatus)}</strong></p>`);if(d.readyToSign){document.getElementById('signBtn').disabled=false;msg('Payment confirmed. You can now sign.',true)}else setTimeout(checkPayment,15000);}catch(e){/* do not loop on invalid session */}}
  async function sign(e){e.preventDefault();try{const answers={};agreement.fields.forEach(f=>answers[f.key]=answer(f));const c=document.getElementById('canvas');const payload={answers,signerName:document.getElementById('signerName').value,signerEmail:document.getElementById('signerEmail').value,signatureType:drawn?'drawn':'typed',signatureText:drawn?'':document.getElementById('signatureText').value,signatureDataUrl:drawn?c.toDataURL('image/png'):null,signingToken:signingToken||undefined,businessSignatoryCapacity:document.getElementById('capacity')?.value||null,witnessName:document.getElementById('witnessName')?.value||null,witnessSignature:document.getElementById('witnessSignature')?.value||null,guardianName:document.getElementById('guardianName')?.value||null,guardianEmail:document.getElementById('guardianEmail')?.value||null,guardianRelationship:document.getElementById('guardianRelationship')?.value||null,guardianSignatureText:document.getElementById('guardianSignatureText')?.value||null,companyStampDataUrl:await fileData('companyStamp')};const d=await req('/agreement-forms/'+encodeURIComponent(slug)+'/sign',{method:'POST',headers:headers(),body:JSON.stringify(payload)});document.getElementById('form').classList.add('hidden');const url=api+'/agreement-forms/'+encodeURIComponent(slug)+'/document/'+d.submissionId+'?token='+encodeURIComponent(d.downloadToken);document.getElementById('done').innerHTML=`<div class="alert ok receipt"><h2>Signed successfully</h2><p>Reference: <strong>${esc(d.reference)}</strong></p><p><a href="${esc(url)}" target="_blank" rel="noopener">Download your signed PDF</a></p>${d.postSigningRequirements?`<p>${esc(d.postSigningRequirements)}</p>`:''}${d.paymentRequired?`<p><strong>Payment is still required.</strong> Use the payment section below to complete the EFT.</p><p><button id="afterPay" class="btn secondary">Start EFT payment</button></p>`:''}</div>`;if(d.paymentRequired){document.getElementById('afterPay').onclick=async()=>{try{const p=await req('/agreement-payments/'+encodeURIComponent(slug)+'/start',{method:'POST',headers:headers(),body:JSON.stringify({method:'eft',termsAccepted:true,submissionId:d.submissionId,downloadToken:d.downloadToken,payerName:payload.signerName,payerEmail:payload.signerEmail})});msg('EFT created. Reference: '+p.payment.reference+'. '+(p.instructions?JSON.stringify(p.instructions):''),true)}catch(x){msg(x.message)}}}msg('Agreement signed successfully.',true);}catch(err){msg(err.message)}}
  load();
})();
</script>
</body></html>
