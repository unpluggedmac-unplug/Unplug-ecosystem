<!doctype html>
<html lang="en"><head><script src="/runtime-config"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Agreement | Unplug Magazine</title>
<style>
:root{--ink:#000001;--paper:#ebe9e9;--hot:#ff2f00;--deep:#e83b00;--orange:#ff4d00;--white:#fff;--line:#d1cdca}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{background:var(--ink);color:#fff;padding:17px 5vw;display:flex;justify-content:space-between;gap:18px;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--hot)}.wrap{max-width:980px;margin:30px auto;padding:0 18px 70px}.card{background:#fff;border:1px solid var(--line);padding:26px;margin-bottom:16px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--deep);font-weight:900}.title{font-size:clamp(31px,6vw,56px);line-height:1;margin:8px 0 13px}.muted{color:#655f5b}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #aaa29d;background:#fff;font:inherit}.field textarea{min-height:105px;resize:vertical}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}.section h2{font-size:21px}.btn{border:1px solid var(--ink);background:#fff;padding:12px 18px;font-weight:900;cursor:pointer}.btn.primary{background:var(--hot);border-color:var(--hot);color:#fff}.btn.dark{background:var(--ink);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap}.alert{padding:12px 14px;border:1px solid var(--hot);background:#fff0ec;margin-bottom:14px}.alert.ok{border-color:#2e7d32;background:#eff9f0}.hidden{display:none!important}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice button{padding:20px;border:2px solid var(--ink);background:#fff;font-weight:900;font-size:16px;cursor:pointer}.choice button.active{background:var(--ink);color:#fff}.check{display:flex;gap:9px;align-items:flex-start;margin:11px 0}.check input{width:auto;margin-top:3px}.clause{border-left:4px solid var(--hot);padding-left:14px;margin:14px 0;line-height:1.55}.clause h3{margin-bottom:6px}.signature{border:1px dashed #777;background:#fff;touch-action:none;width:100%;height:180px}.tabs{display:flex;gap:7px;margin-bottom:10px}.tabs button.active{background:var(--ink);color:#fff}.statusline{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.statusline span{border:1px solid var(--line);padding:4px 7px;font-size:10px;text-transform:uppercase}.statusline span.current{background:var(--ink);color:#fff}.uploadbox{border:1px solid var(--line);padding:12px;margin:10px 0}.uploadbox.done{border-color:#2e7d32;background:#f3fbf4}.popia{background:#fff8ef;border:1px solid #ffc58f;padding:12px;margin-top:8px;font-size:12px}.review{white-space:pre-wrap;line-height:1.55}.fine{font-size:11px;color:#68615d}.locked{border:2px solid var(--ink);padding:16px;background:#f8f7f6}@media(max-width:700px){.grid2,.grid3,.choice{grid-template-columns:1fr}.card{padding:20px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><div class="brand">UNPLUG <b>MAGAZINE</b></div><div id="env"></div></header><main class="wrap"><div id="alert" class="alert hidden"></div><section id="app" class="card"><p>Loading your secure agreement…</p></section></main>
<script>
(function(){
const token=new URLSearchParams(location.search).get('token')||'';const API=String(window.UNPLUG_RUNTIME_API||'https://unplug-ecosystem.onrender.com').replace(/\/$/,'');const AUTH=localStorage.getItem('accessToken')||'';const app=document.getElementById('app'),alertBox=document.getElementById('alert');document.getElementById('env').textContent=window.UNPLUG_ENV==='staging'?'STAGING':'';let state=null,answers={},partyBType=null,drawMode=false,uploadedSignatureData=null,uploadedItems=new Set();const sectionNames={agreement_identification:'Agreement identification',party_a_business:'Party A — Unplug / business',party_b_individual:'Party B — Individual',party_b_business:'Party B — Business',scope:'Scope of agreement',financial_information:'Financial information',rights_content_ip:'Rights, content and intellectual property',privacy_confidentiality:'Privacy and confidentiality',risk_warranties_legal:'Risk, warranties and legal provisions',agreement_specific_questions:'Agreement-specific questions',declarations_signatures:'Declarations and signatures'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function msg(t,ok=false){alertBox.textContent=t;alertBox.className='alert '+(ok?'ok':'');alertBox.classList.remove('hidden');alertBox.scrollIntoView({behavior:'smooth',block:'center'});}async function req(path,opt={}){const headers=Object.assign({},AUTH?{Authorization:'Bearer '+AUTH}:{},opt.body instanceof FormData?{}:{'Content-Type':'application/json'},opt.headers||{});const r=await fetch(API+path,{...opt,headers});const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json().catch(()=>({})):await r.text();if(!r.ok)throw Object.assign(new Error(d&&d.error||`Request failed (${r.status})`),{status:r.status});return d;}
if(!token){app.innerHTML='<h1>Agreement link incomplete</h1><p>This private link does not contain an access token.</p>';return;}
const FLOW=['draft','sent','in_progress','submitted','under_review','signed','completed','archived'];
async function load(){try{state=await req('/agreement-forms/generator/access/'+encodeURIComponent(token));answers={...(state.draft?.answers||{})};partyBType=state.agreement.partyBType||state.draft?.partyBType||null;render();}catch(e){if(e.status===401)app.innerHTML='<h1>Member sign-in required</h1><p>This agreement was configured for member access. Please sign in to your Unplug account and then open this link again.</p><p><a class="btn dark" href="/?p=login">Sign in</a></p>';else app.innerHTML=`<h1>Agreement unavailable</h1><p>${esc(e.message)}</p>`;}}
function render(){const a=state.agreement,d=state.draft||{};if(a.locked){app.innerHTML=`<div class="eyebrow">Agreement · ${esc(a.reference)} · Version ${esc(a.version)}</div><h1 class="title">${esc(a.title)}</h1><div class="locked"><strong>This agreement has been submitted and is locked.</strong><p>Status: ${esc(a.status.replace('_',' '))}</p>${state.delivery.allowDownload?'<button id="downloadLocked" class="btn primary">Download completed PDF</button>':''}</div>`;document.getElementById('downloadLocked')?.addEventListener('click',downloadPdf);return;}const needChoice=a.signerType==='choice'&&!partyBType;const flow=FLOW.map(x=>`<span class="${x===a.status?'current':''}">${esc(x.replace('_',' '))}</span>`).join('');app.innerHTML=`<div class="eyebrow">Secure Agreement · ${esc(a.reference)} · Version ${esc(a.version)}</div><h1 class="title">${esc(a.title)}</h1><p class="muted">${esc(a.description||'Please complete, review and sign this agreement carefully.')}</p><div class="statusline">${flow}</div>${a.signingOrder==='party_a_first'&&!a.partyASigned?'<div class="alert">Party A must sign before Party B can submit. You may review the agreement, but submission remains blocked until Party A signs.</div>':''}${needChoice?partyChoiceHtml():formHtml(a,d)}`;if(needChoice)wireChoice();else wireForm();}
function partyChoiceHtml(){return `<div class="section"><h2>Who is Party B?</h2><p>Choose the party completing this agreement. Only the relevant fields will be shown.</p><div class="choice"><button data-party="individual">Individual</button><button data-party="business">Business</button></div></div>`;}
function wireChoice(){document.querySelectorAll('[data-party]').forEach(b=>b.onclick=async()=>{partyBType=b.dataset.party;try{await saveDraft(true);await load();}catch(e){msg(e.message)}});}
function formHtml(a,d){const fields=a.fields||[];const groups={};fields.forEach(f=>(groups[f.sectionKey||'agreement_specific_questions']??=[]).push(f));const fieldSections=Object.keys(groups).map(k=>`<div class="section"><h2>${esc(sectionNames[k]||k.replaceAll('_',' '))}</h2>${groups[k].map(fieldHtml).join('')}</div>`).join('');return `<form id="agreementForm"><div class="section"><h2>Party B details</h2><div class="grid2"><div class="field"><label>Signer / authorised representative name *</label><input id="signerName" value="${esc(d.signerName||'')}" required></div><div class="field"><label>Email *</label><input id="signerEmail" type="email" value="${esc(d.signerEmail||'')}" required></div><div class="field"><label>Mobile</label><input id="mobile" type="tel" value="${esc(d.mobile||'')}"></div><div class="field"><label>Capacity / role</label><input id="capacity" value="${esc(d.capacity||'')}"></div></div>${a.signerType==='choice'?`<p class="fine">Party B: <strong>${esc(partyBType)}</strong> · <button id="changeParty" type="button" class="btn">Change</button></p>`:''}</div>${fieldSections}${clausesHtml(a)}${itemsHtml(a)}${verificationHtml(a)}${declarationsHtml(a)}${signatureHtml(a)}<div class="section"><h2>Review & submit</h2><p class="fine">Submitting locks the completed record. Any later reopening is recorded in the audit history. A fully signed agreement is preserved and superseded rather than overwritten.</p><div class="actions"><button id="saveDraft" type="button" class="btn">Save & resume later</button><button id="submitAgreement" class="btn primary" ${!a.verified||a.partyBSigned||(a.signingOrder==='party_a_first'&&!a.partyASigned)?'disabled':''}>Submit & sign agreement</button></div></div></form>`;}
function fieldHtml(f){const id='f_'+f.key,val=answers[f.key]??'',required=f.required?'required':'';let control='';if(f.kind==='textarea')control=`<textarea id="${id}" ${required}>${esc(val)}</textarea>`;else if(f.kind==='select')control=`<select id="${id}" ${required}><option value="">Choose…</option>${(f.options||[]).map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(f.kind==='radio')control=(f.options||[]).map(o=>`<label class="check"><input type="radio" name="${id}" value="${esc(o)}" ${String(val)===String(o)?'checked':''}> <span>${esc(o)}</span></label>`).join('');else if(f.kind==='checkbox')control=`<label class="check"><input id="${id}" type="checkbox" ${val===true?'checked':''} ${required}> <span>${esc(f.label)}</span></label>`;else if(f.kind==='file')control=`<input id="${id}" type="url" value="${esc(val)}" placeholder="Stored file URL">`;else control=`<input id="${id}" type="${f.kind==='phone'?'tel':(['email','number','date'].includes(f.kind)?f.kind:'text')}" value="${esc(val)}" ${required} maxlength="${f.maxLength||5000}">`;const popia=f.popia?.enabled?`<div class="popia"><strong>POPIA notice</strong><br>Purpose: ${esc(f.popia.purpose)}<br>Retention: ${esc(f.popia.retentionPeriod)}<br>Access: ${esc(f.popia.access)}${f.popia.acknowledgementRequired?`<label class="check"><input type="checkbox" data-popia="${esc(f.key)}"> <span>I acknowledge this collection and use of my ID/passport information.</span></label>`:''}</div>`:'';return `<div class="field" data-field-key="${esc(f.key)}">${f.kind==='checkbox'?'':`<label for="${id}">${esc(f.label)}${f.required?' *':''}</label>`}${control}${f.help?`<div class="fine">${esc(f.help)}</div>`:''}${popia}</div>`;}
function clausesHtml(a){if(!a.rules&&!a.terms&&!(a.clauses||[]).length)return'';return `<div class="section"><h2>Agreement terms and clauses</h2>${a.rules?`<div class="clause"><h3>Rules / requirements</h3><div class="review">${esc(a.rules)}</div></div>`:''}${a.terms?`<div class="clause"><h3>Terms</h3><div class="review">${esc(a.terms)}</div></div>`:''}${(a.clauses||[]).map(c=>`<div class="clause"><h3>${esc(c.title||'Clause')}</h3><div>${safeClause(c.bodyHtml)}</div></div>`).join('')}</div>`;}
function safeClause(html){const t=document.createElement('template');t.innerHTML=String(html||'');t.content.querySelectorAll('script,style,iframe,object,embed').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value))el.removeAttribute(a.name)}));return t.innerHTML;}
function itemsHtml(a){if(!(a.items||[]).length)return'';return `<div class="section"><h2>Notes & supporting uploads</h2>${a.items.map(i=>i.kind==='note'?`<div class="field"><label>${esc(i.label)}${i.required?' *':''}</label><textarea data-item-note="${i.id}" ${i.required?'required':''}></textarea>${i.help?`<div class="fine">${esc(i.help)}</div>`:''}</div>`:`<div class="uploadbox ${uploadedItems.has(Number(i.id))?'done':''}" data-upload-box="${i.id}"><strong>${esc(i.label)}${i.required?' *':''}</strong>${i.help?`<div class="fine">${esc(i.help)}</div>`:''}<p><input type="file" data-item-file="${i.id}" accept="image/jpeg,image/png,image/webp,application/pdf"> <button type="button" class="btn" data-upload="${i.id}">Upload securely</button></p><div class="fine" data-upload-state="${i.id}">${uploadedItems.has(Number(i.id))?'Uploaded securely.':'JPEG, PNG, WEBP or PDF · max 10 MB'}</div></div>`).join('')}</div>`;}
function verificationHtml(a){return `<div class="section"><h2>Verify your contact details</h2>${a.verified?'<div class="alert ok">Verified with a one-time code.</div>':`<p>Choose email or mobile verification. A one-time code expires after 10 minutes.</p><div class="grid2"><div><button type="button" id="requestEmail" class="btn">Send code by email</button></div><div><button type="button" id="requestMobile" class="btn">Send code by mobile</button></div></div><div class="grid2"><div class="field"><label>Verification channel</label><select id="verifyChannel"><option value="email">Email</option><option value="mobile">Mobile</option></select></div><div class="field"><label>6-digit code</label><input id="verifyCode" inputmode="numeric" maxlength="6"></div></div><button type="button" id="confirmCode" class="btn dark">Confirm code</button>`}</div>`;}
function declarationsHtml(a){const ds=a.declarations||[];if(!ds.length)return'';return `<div class="section"><h2>Declarations</h2>${ds.map(d=>`<label class="check"><input type="checkbox" data-declaration="${esc(d.id||d.key)}" ${d.required===false?'':'required'}> <span>${esc(d.text||d.label||d.id||d.key)}</span></label>`).join('')}</div>`;}
function signatureHtml(a){return `<div class="section"><h2>Signature</h2><div class="tabs"><button type="button" class="btn active" data-sig="typed">Typed name</button><button type="button" class="btn" data-sig="drawn">Draw signature</button><button type="button" class="btn" data-sig="uploaded">Upload signature</button></div><div id="typedSig" class="field"><label>Type your full signature</label><input id="signatureText"></div><div id="drawnSig" class="hidden"><canvas id="signatureCanvas" class="signature"></canvas><p><button type="button" id="clearCanvas" class="btn">Clear</button></p></div><div id="uploadedSig" class="hidden"><div class="field"><label>Upload signature image (PNG/JPEG/WEBP, under 400 KB)</label><input id="signatureFile" type="file" accept="image/png,image/jpeg,image/webp"></div><div id="signatureFileState" class="fine"></div></div></div>`;}
function wireForm(){document.getElementById('changeParty')?.addEventListener('click',()=>{partyBType=null;state.agreement.partyBType=null;render()});document.getElementById('saveDraft').onclick=()=>saveDraft(false).catch(e=>msg(e.message));document.getElementById('agreementForm').addEventListener('submit',submit);document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>uploadItem(Number(b.dataset.upload)));document.getElementById('requestEmail')?.addEventListener('click',()=>requestCode('email'));document.getElementById('requestMobile')?.addEventListener('click',()=>requestCode('mobile'));document.getElementById('confirmCode')?.addEventListener('click',confirmCode);document.querySelectorAll('[data-sig]').forEach(b=>b.onclick=()=>selectSignature(b.dataset.sig,b));setupCanvas();document.getElementById('signatureFile')?.addEventListener('change',readSignatureFile);}
function collectAnswers(){const out={};(state.agreement.fields||[]).forEach(f=>{const id='f_'+f.key;if(f.kind==='radio'){const e=document.querySelector(`input[name="${id}"]:checked`);out[f.key]=e?e.value:null;}else{const e=document.getElementById(id);if(!e)return;out[f.key]=f.kind==='checkbox'?e.checked:e.value.trim();}});return out;}
function collectItems(){return [...document.querySelectorAll('[data-item-note]')].map(e=>({id:Number(e.dataset.itemNote),noteText:e.value}));}
function baseDraft(){return {partyBType,signerName:document.getElementById('signerName')?.value||'',signerEmail:document.getElementById('signerEmail')?.value||'',mobile:document.getElementById('mobile')?.value||'',capacity:document.getElementById('capacity')?.value||'',answers:collectAnswers(),items:collectItems()};}
async function saveDraft(silent){const d=baseDraft();answers=d.answers;await req('/agreement-forms/generator/access/'+encodeURIComponent(token)+'/draft',{method:'PATCH',body:JSON.stringify(d)});if(!silent)msg('Draft saved. You can safely return using this private link.',true);}
async function uploadItem(id){const input=document.querySelector(`[data-item-file="${id}"]`),f=input?.files?.[0];if(!f){msg('Choose a file first.');return;}const form=new FormData();form.append('file',f);const stateEl=document.querySelector(`[data-upload-state="${id}"]`);stateEl.textContent='Uploading securely…';try{const d=await req(`/agreement-forms/generator/access/${encodeURIComponent(token)}/items/${id}/upload`,{method:'POST',body:form});uploadedItems.add(id);stateEl.textContent=`Uploaded securely: ${d.filename}`;document.querySelector(`[data-upload-box="${id}"]`).classList.add('done');}catch(e){stateEl.textContent=e.message;msg(e.message)}}
async function requestCode(channel){try{await saveDraft(true);const d=baseDraft();const destination=channel==='email'?d.signerEmail:d.mobile;await req(`/agreement-forms/generator/access/${encodeURIComponent(token)}/verify/request`,{method:'POST',body:JSON.stringify({channel,destination})});document.getElementById('verifyChannel').value=channel;msg(`One-time code sent by ${channel}.`,true);}catch(e){msg(e.message)}}
async function confirmCode(){try{const channel=document.getElementById('verifyChannel').value,code=document.getElementById('verifyCode').value;await req(`/agreement-forms/generator/access/${encodeURIComponent(token)}/verify/confirm`,{method:'POST',body:JSON.stringify({channel,code})});msg('Verification complete.',true);await load();}catch(e){msg(e.message)}}
function selectSignature(type,button){drawMode=type==='drawn';document.querySelectorAll('[data-sig]').forEach(b=>b.classList.toggle('active',b===button));document.getElementById('typedSig').classList.toggle('hidden',type!=='typed');document.getElementById('drawnSig').classList.toggle('hidden',type!=='drawn');document.getElementById('uploadedSig').classList.toggle('hidden',type!=='uploaded');state.signatureType=type;}
function setupCanvas(){const c=document.getElementById('signatureCanvas');if(!c)return;const ctx=c.getContext('2d');function size(){const ratio=devicePixelRatio||1;c.width=c.clientWidth*ratio;c.height=c.clientHeight*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=2.2;ctx.lineCap='round'}size();let down=false,last=null;function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{down=true;last=point(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;const n=point(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(n.x,n.y);ctx.stroke();last=n};c.onpointerup=()=>{down=false};document.getElementById('clearCanvas').onclick=()=>ctx.clearRect(0,0,c.width,c.height);}
function readSignatureFile(){const f=document.getElementById('signatureFile').files?.[0];uploadedSignatureData=null;if(!f)return;if(f.size>400*1024){document.getElementById('signatureFileState').textContent='File is too large (max 400 KB).';return;}const r=new FileReader();r.onload=()=>{uploadedSignatureData=r.result;document.getElementById('signatureFileState').textContent='Signature image ready.'};r.onerror=()=>document.getElementById('signatureFileState').textContent='Could not read signature image.';r.readAsDataURL(f);}
function declarations(){const out={};document.querySelectorAll('[data-declaration]').forEach(e=>out[e.dataset.declaration]=e.checked);document.querySelectorAll('[data-popia]').forEach(e=>out['popia:'+e.dataset.popia]=e.checked);return out;}
async function submit(e){e.preventDefault();try{await saveDraft(true);const type=state.signatureType||'typed';let dataUrl=null,text=null;if(type==='typed'){text=document.getElementById('signatureText')?.value.trim();if(!text)throw new Error('Type your signature before submitting.');}else if(type==='drawn'){dataUrl=document.getElementById('signatureCanvas').toDataURL('image/png');}else{dataUrl=uploadedSignatureData;if(!dataUrl)throw new Error('Choose a signature image before submitting.');}const d=baseDraft();const payload={...d,declarationsAccepted:declarations(),signatureType:type,signatureText:text,signatureDataUrl:dataUrl};const result=await req(`/agreement-forms/generator/access/${encodeURIComponent(token)}/submit`,{method:'POST',body:JSON.stringify(payload)});msg(`Agreement submitted successfully. Reference: ${result.reference}`,true);await load();}catch(e){msg(e.message)}}
async function downloadPdf(){try{const r=await fetch(API+`/agreement-forms/generator/access/${encodeURIComponent(token)}/pdf`,{headers:AUTH?{Authorization:'Bearer '+AUTH}:{}});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Could not download PDF.')}const b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=(state?.agreement?.reference||'agreement')+'.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}catch(e){msg(e.message)}}
load();
})();
</script></body></html>
