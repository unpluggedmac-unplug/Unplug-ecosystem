<!doctype html>
<html lang="en">
<head>
  <script src="/runtime-config"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Growth Applications | Unplug Control Centre</title>
  <link rel="stylesheet" href="/unplug-tokens.css">
  <style>
    :root{--ink:#000001;--paper:#ebe9e9;--hot:#ff2f00;--deep:#e83b00;--orange:#ff4d00;--white:#fff;--line:#d5d0cc;--muted:#68635f;--green:#166534}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{background:#000;color:#fff;padding:16px 4vw;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:900;letter-spacing:.08em}.brand b{color:var(--hot)}.wrap{max-width:1400px;margin:24px auto;padding:0 16px 80px}.layout{display:grid;grid-template-columns:380px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 28px rgba(0,0,0,.04)}.queue{max-height:75vh;overflow:auto}.item{border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0;cursor:pointer}.item:hover,.item.active{border-color:var(--hot);background:#fff8f5}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--deep);font-weight:900}.muted{font-size:12px;color:var(--muted);line-height:1.45}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f0ece9;font-size:10px;font-weight:900;text-transform:uppercase}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab,.btn{border:1px solid var(--ink);border-radius:999px;background:#fff;padding:9px 13px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.tab.active,.btn.dark{background:#000;color:#fff}.btn.primary{background:var(--hot);color:#fff;border-color:var(--hot)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:0 0 13px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid #bbb4af;border-radius:10px;font:inherit}.field textarea{min-height:120px;resize:vertical}.section{border-top:1px solid #eee8e4;padding-top:16px;margin-top:16px}.answer{padding:9px 0;border-bottom:1px solid #f0ece9}.answer strong{display:block;font-size:12px;margin-bottom:3px}.links a{display:block;color:var(--deep);overflow-wrap:anywhere;margin:6px 0}.task{border-left:4px solid var(--hot);padding:10px 12px;background:#fff8f5;margin:8px 0}.message{border-left:4px solid #111;padding:9px 12px;background:#f4f2f1;margin:8px 0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.check{display:flex;gap:8px;align-items:flex-start;font-size:12px}.preview{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2000;padding:30px;overflow:auto}.preview-inner{max-width:900px;margin:auto;background:#fff;border-radius:18px;padding:24px}.preview-banner{background:#000;color:#fff;padding:9px 12px;font-weight:900;margin:-24px -24px 18px;border-radius:18px 18px 0 0}.hidden{display:none!important}.alert{padding:11px 13px;border:1px solid #ffc6b8;background:#fff0ec;border-radius:10px;margin:10px 0}.good{border-color:#aad9b5;background:#effbf1}.actions{display:flex;gap:8px;flex-wrap:wrap}.raw{white-space:pre-wrap;word-break:break-word;font-size:12px}.status-row{display:grid;grid-template-columns:1fr 2fr;gap:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}.queue{max-height:none}.grid,.settings-grid,.status-row{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="top"><div class="brand">UNPLUG <b>CONTROL CENTRE</b> · Growth</div><div><a href="/unplug-admin-dashboard.html" style="color:#fff">Back to Control Centre</a></div></header>
<main class="wrap">
  <div id="notice" class="alert hidden"></div>
  <div class="layout">
    <aside class="card"><div class="eyebrow">Growth Applications</div><h2 style="margin:5px 0 10px">Review queue</h2><div class="field"><label>Status</label><select id="filter"><option value="">All</option><option value="new">New</option><option value="under_review">Under review</option><option value="contacted">Contacted</option><option value="in_progress">In progress</option><option value="closed">Closed</option></select></div><button class="btn dark" id="settingsBtn">Form settings</button><div id="queue" class="queue"><p>Loading…</p></div></aside>
    <section class="card" id="detail"><h2>Select an application</h2><p class="muted">Choose someone from the queue to open their research workspace and Growth Journey.</p></section>
  </div>
</main>
<div id="preview" class="preview hidden"><div class="preview-inner"><div class="preview-banner">PREVIEW — PLACEHOLDER DATA — NOTHING STORED</div><div class="actions" style="justify-content:flex-end"><button class="btn" id="closePreview">Close</button></div><div id="previewBody"></div></div></div>
<script src="/unplug-shared.js"></script>
<script>
(function(){
  const apiBase=String(window.UNPLUG_RUNTIME_API||'https://unplug-ecosystem.onrender.com').replace(/\/$/,'');
  const q=document.getElementById('queue'),detail=document.getElementById('detail'),notice=document.getElementById('notice');let selected=null,current=null;
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function msg(t,good=false){notice.textContent=t;notice.className='alert'+(good?' good':'');notice.classList.remove('hidden');setTimeout(()=>notice.classList.add('hidden'),4000)}
  const ADMIN_TOKEN=localStorage.getItem('unplug_admin_token')||'';
  async function api(path,opt={}){const headers=Object.assign({'Content-Type':'application/json'},ADMIN_TOKEN?{Authorization:'Bearer '+ADMIN_TOKEN}:{},opt.headers||{});const response=await fetch(apiBase+path,Object.assign({},opt,{headers}));const contentType=response.headers.get('content-type')||'';const data=contentType.includes('json')?await response.json().catch(()=>({})):await response.text();if(!response.ok)throw new Error((data&&data.error)||'Request failed ('+response.status+')');return data}
  function token(){return ADMIN_TOKEN}
  function display(v){if(v==null)return'';if(Array.isArray(v))return v.join(', ');if(typeof v==='object'){if(v.unavailable)return"I don't have this";if(Array.isArray(v.selected))return v.selected.join(', ');if(v.context!=null)return (v.answer||'')+' — '+v.context;return v.value||v.answer||JSON.stringify(v)}return String(v)}
  function statusLabel(s){return String(s||'').replaceAll('_',' ')}
  async function boot(){if(!ADMIN_TOKEN){detail.innerHTML='<h2>Sign in required</h2><p>Open the Control Centre and sign in first.</p>';return}try{const data=await api('/auth/me'),user=data.user;if(!user||!['admin','staff'].includes(user.role)){detail.innerHTML='<h2>Admin access required</h2>';return}document.getElementById('filter').onchange=loadQueue;document.getElementById('settingsBtn').onclick=renderSettings;document.getElementById('closePreview').onclick=()=>document.getElementById('preview').classList.add('hidden');await loadQueue()}catch(_){detail.innerHTML='<h2>Sign in required</h2><p>Open the Control Centre and sign in first.</p>'}}
  async function loadQueue(){try{const s=document.getElementById('filter').value;const d=await api('/growth-application/admin/applications'+(s?'?status='+encodeURIComponent(s):''));q.innerHTML=(d.applications||[]).length?d.applications.map(a=>'<div class="item '+(String(selected)===String(a.id)?'active':'')+'" data-id="'+a.id+'"><div style="display:flex;justify-content:space-between;gap:8px"><strong>'+esc(a.applicant_email)+'</strong><span class="pill">'+esc(statusLabel(a.status))+'</span></div><div class="muted">'+esc(a.applicant_type)+' · '+(a.submitted_at?'submitted '+new Date(a.submitted_at).toLocaleDateString('en-ZA'):'draft')+'</div></div>').join(''):'<p class="muted">No applications in this view.</p>';q.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openApplication(el.dataset.id));}catch(e){q.innerHTML='<p>'+esc(e.message)+'</p>'}}
  async function openApplication(id){selected=id;try{current=await api('/growth-application/admin/applications/'+id);renderDetail();loadQueue();}catch(e){msg(e.message)}}
  function renderDetail(){const a=current.application,p=current.progress||{},quick=a.quick_profile||{},deep=a.applicant_type==='business'?a.deep_discovery_business:a.deep_discovery_individual;const urls=Object.entries(quick).filter(([k,v])=>k.endsWith('_url')&&typeof v==='string'&&v).map(([k,v])=>'<a href="'+esc(v)+'" target="_blank" rel="noopener">'+esc(k.replaceAll('_',' '))+' → '+esc(v)+'</a>').join('');detail.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><div class="eyebrow">'+esc(a.applicant_type)+' · #'+a.id+'</div><h2 style="margin:5px 0">'+esc(a.applicant_email)+'</h2></div><span class="pill">'+esc(statusLabel(a.status))+'</span></div><div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="answers">Answers</button><button class="tab" data-tab="research">Research</button><button class="tab" data-tab="tasks">Tasks</button><button class="tab" data-tab="history">Messages</button></div><div id="tabHost"></div><div class="section"><h3>Pipeline</h3><div class="status-row"><div class="field"><label>Status</label><select id="statusSelect">'+['new','under_review','contacted','in_progress','closed'].map(s=>'<option value="'+s+'" '+(s===a.status?'selected':'')+'>'+statusLabel(s)+'</option>').join('')+'</select></div><div class="field"><label>Applicant message (required for Contacted, In progress, Closed)</label><textarea id="statusMessage" placeholder="Write the message this applicant will receive…"></textarea></div></div><div class="field hidden" id="closeReasonWrap"><label>Private closed reason *</label><textarea id="closeReason"></textarea></div><button class="btn primary" id="applyStatus">Apply status</button></div><div class="section actions"><button class="btn dark" id="pdfBtn">Open application PDF</button><button class="btn" data-preview="quick_profile">Preview Quick Profile</button><button class="btn" data-preview="growth_assessment">Preview Growth Assessment</button><button class="btn" data-preview="deep_discovery">Preview Deep Discovery</button><button class="btn" data-preview="resume">Preview Resume</button><button class="btn" data-preview="pdf">Preview PDF</button></div>';
    window.__growthUrls=urls;window.__growthQuick=quick;window.__growthDeep=deep||{};window.__growthProgress=p;wireTabs();showTab('overview');const sel=document.getElementById('statusSelect');const showClose=()=>document.getElementById('closeReasonWrap').classList.toggle('hidden',sel.value!=='closed');sel.onchange=showClose;showClose();document.getElementById('applyStatus').onclick=applyStatus;document.getElementById('pdfBtn').onclick=()=>openPdf('/growth-application/admin/applications/'+a.id+'/pdf');detail.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>preview(b.dataset.preview,a.applicant_type));}
  function wireTabs(){detail.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{detail.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');showTab(b.dataset.tab)})}
  function showTab(tab){const host=document.getElementById('tabHost'),a=current.application;if(tab==='overview'){host.innerHTML='<div class="grid"><div><h3>Completion</h3>'+Object.entries(window.__growthProgress||{}).map(([k,v])=>'<div class="answer"><strong>'+esc(k.replaceAll('_',' '))+'</strong><span class="pill">'+(v?'complete':'incomplete')+'</span></div>').join('')+'</div><div><h3>Dates</h3><p class="muted">Created: '+new Date(a.created_at).toLocaleString('en-ZA')+'<br>Submitted: '+(a.submitted_at?new Date(a.submitted_at).toLocaleString('en-ZA'):'Not yet')+'<br>Updated: '+new Date(a.updated_at).toLocaleString('en-ZA')+'</p></div></div>';return}if(tab==='answers'){host.innerHTML='<h3>Quick Profile</h3>'+answersHtml(a.quick_profile)+'<h3>Growth Assessment</h3>'+answersHtml(a.growth_assessment)+'<h3>Deep Discovery</h3>'+answersHtml(window.__growthDeep);return}if(tab==='research'){host.innerHTML='<div class="grid"><div><h3>Applicant links</h3><div class="links">'+(window.__growthUrls||'<p class="muted">No links supplied.</p>')+'</div></div><div><div class="field"><label>Research notes (private)</label><textarea id="researchNotes">'+esc(a.research_notes||'')+'</textarea></div><div class="field"><label>Admin follow-up notes (private)</label><textarea id="adminNotes">'+esc(a.admin_notes||'')+'</textarea></div><button class="btn dark" id="saveNotes">Save notes</button></div></div>';document.getElementById('saveNotes').onclick=saveNotes;return}if(tab==='tasks'){host.innerHTML='<h3>Growth Journey tasks</h3><div id="taskList">'+((current.tasks||[]).length?current.tasks.map(taskHtml).join(''):'<p class="muted">No tasks yet.</p>')+'</div><div class="grid"><div class="field"><label>New task title</label><input id="taskTitle"></div><div class="field"><label>Due date (optional)</label><input id="taskDue" type="date"></div></div><button class="btn primary" id="addTask">Assign task</button>';document.getElementById('addTask').onclick=addTask;host.querySelectorAll('[data-task-status]').forEach(s=>s.onchange=()=>updateTask(s.dataset.taskStatus,s.value));return}host.innerHTML='<h3>Applicant messages</h3>'+((current.messages||[]).length?current.messages.map(m=>'<div class="message"><strong>'+esc(statusLabel(m.transition_status))+'</strong><div>'+esc(m.message)+'</div><div class="muted">'+new Date(m.created_at).toLocaleString('en-ZA')+'</div></div>').join(''):'<p class="muted">No applicant-facing status messages yet.</p>');}
  function answersHtml(obj){const entries=Object.entries(obj||{}).filter(([,v])=>display(v));return entries.length?entries.map(([k,v])=>'<div class="answer"><strong>'+esc(k.replaceAll('_',' '))+'</strong>'+esc(display(v))+'</div>').join(''):'<p class="muted">No answers reached yet.</p>'}
  function taskHtml(t){return '<div class="task"><strong>'+esc(t.title)+'</strong><div class="muted">'+(t.due_date?'Due '+esc(String(t.due_date).slice(0,10)):'No due date')+'</div><select data-task-status="'+t.id+'"><option value="pending" '+(t.status==='pending'?'selected':'')+'>Pending</option><option value="in_progress" '+(t.status==='in_progress'?'selected':'')+'>In progress</option><option value="completed" '+(t.status==='completed'?'selected':'')+'>Completed</option><option value="cancelled" '+(t.status==='cancelled'?'selected':'')+'>Cancelled</option></select></div>'}
  async function saveNotes(){try{const d=await api('/growth-application/admin/applications/'+selected+'/notes',{method:'PATCH',body:JSON.stringify({research_notes:document.getElementById('researchNotes').value,admin_notes:document.getElementById('adminNotes').value})});current.application=d.application;msg('Notes saved.',true)}catch(e){msg(e.message)}}
  async function addTask(){const title=document.getElementById('taskTitle').value.trim();if(!title)return msg('Task title is required.');try{await api('/growth-application/admin/applications/'+selected+'/tasks',{method:'POST',body:JSON.stringify({title,due_date:document.getElementById('taskDue').value||null})});await openApplication(selected);showTab('tasks');msg('Task assigned.',true)}catch(e){msg(e.message)}}
  async function updateTask(id,status){try{await api('/growth-application/admin/tasks/'+id,{method:'PATCH',body:JSON.stringify({status})});msg('Task updated.',true)}catch(e){msg(e.message)}}
  async function applyStatus(){const status=document.getElementById('statusSelect').value,message=document.getElementById('statusMessage').value.trim(),closed_reason=document.getElementById('closeReason')?.value.trim()||'';try{await api('/growth-application/admin/applications/'+selected+'/status',{method:'PATCH',body:JSON.stringify({status,message,closed_reason})});await openApplication(selected);msg('Pipeline updated.',true)}catch(e){msg(e.message)}}
  async function renderSettings(){selected=null;loadQueue();try{const d=await api('/growth-application/admin/settings');const values=Object.fromEntries((d.settings||[]).map(s=>[s.key,s.value]));detail.innerHTML='<div class="eyebrow">Growth Application</div><h2>Form settings</h2><div class="settings-grid"><div><div class="field"><label>Global visibility</label><select id="visibility"><option value="hidden" '+(values.growth_application_site_visibility==='hidden'?'selected':'')+'>Hidden</option><option value="visible" '+(values.growth_application_site_visibility==='visible'?'selected':'')+'>Visible</option></select></div><div class="field"><label>Human response target (business days)</label><input id="responseDays" type="number" min="1" max="60" value="'+esc(values.growth_application_response_days||'5')+'"></div><button class="btn primary" id="saveSettings">Save settings</button></div><div><h3>Page placements</h3><div class="checks">'+(d.placements||[]).map(p=>'<label class="check"><input type="checkbox" data-placement="'+esc(p.page_key)+'" '+(p.enabled?'checked':'')+'> '+esc(p.page_key.replaceAll('_',' '))+'</label>').join('')+'</div></div></div><div class="section"><h3>Short link</h3><p class="muted">Old short codes stay valid after regeneration, including while the form is hidden.</p><div class="actions"><input id="shortCode" placeholder="Optional custom code" style="padding:9px 11px;border:1px solid #bbb;border-radius:10px"><button class="btn dark" id="newCode">Generate / set code</button></div><div style="margin-top:12px">'+((d.short_links||[]).length?d.short_links.map(l=>'<div class="answer"><strong>'+esc(l.short_code)+(l.is_current?' · CURRENT':'')+'</strong><span class="muted">Created '+new Date(l.created_at).toLocaleString('en-ZA')+'</span></div>').join(''):'<p class="muted">No short link yet.</p>')+'</div></div><div class="section"><h3>Preview before publishing</h3><div class="actions"><button class="btn" data-preview="quick_profile">Quick Profile</button><button class="btn" data-preview="growth_assessment">Growth Assessment</button><button class="btn" data-preview="deep_discovery">Deep Discovery</button><button class="btn" data-preview="resume">Resume page</button><button class="btn" data-preview="pdf">PDF</button></div></div><div class="section"><p class="muted">Deep Discovery bank: '+esc(d.question_bank_version)+'<br>Intake schema: '+esc(d.stage_schema_version)+'</p></div>';document.getElementById('saveSettings').onclick=saveSettings;document.getElementById('newCode').onclick=createShortCode;detail.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>preview(b.dataset.preview,'individual'));}catch(e){msg(e.message)}}
  async function saveSettings(){const placements=[...detail.querySelectorAll('[data-placement]')].map(x=>({page_key:x.dataset.placement,enabled:x.checked}));try{await api('/growth-application/admin/settings',{method:'PATCH',body:JSON.stringify({site_visibility:document.getElementById('visibility').value,response_days:Number(document.getElementById('responseDays').value),placements})});msg('Growth Application settings saved.',true)}catch(e){msg(e.message)}}
  async function createShortCode(){try{const d=await api('/growth-application/admin/short-link',{method:'POST',body:JSON.stringify({short_code:document.getElementById('shortCode').value.trim()||undefined})});msg('Short link ready: '+d.url,true);renderSettings()}catch(e){msg(e.message)}}
  async function preview(view,type){if(view==='pdf'){return openPdf('/growth-application/admin/preview?view=pdf&type='+encodeURIComponent(type))}try{const d=await api('/growth-application/admin/preview?view='+encodeURIComponent(view)+'&type='+encodeURIComponent(type));const p=document.getElementById('preview'),body=document.getElementById('previewBody');body.innerHTML='<div class="eyebrow">'+esc(view.replaceAll('_',' '))+'</div><h2>'+esc(type)+' placeholder preview</h2><p class="muted">This preview does not store data.</p><div class="raw">'+esc(JSON.stringify(view==='deep_discovery'?d.deep_discovery:(view==='resume'?{application:d.application,tasks:[{title:'Example growth task',status:'pending'}]}:d.schema[view]),null,2))+'</div>';p.classList.remove('hidden')}catch(e){msg(e.message)}}
  async function openPdf(path){try{const r=await fetch(apiBase+path,{headers:{Authorization:'Bearer '+token()}});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Could not create PDF')}const blob=await r.blob();window.open(URL.createObjectURL(blob),'_blank','noopener')}catch(e){msg(e.message)}}
  boot();
})();
</script>
</body>
</html>
